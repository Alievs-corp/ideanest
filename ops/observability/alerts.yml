# Prometheus alerting rules for the IdeyaNest API — docs/architecture.md §8.4, issue #138.
#
# THREE CONDITIONS ARE NAMED IN §8.4 AND ALL THREE ARE HERE: ledger imbalance,
# collection failure rate, and provider unavailability. Each one has a second rule
# beside it for the failure people forget — the check that stopped running, the
# series that went absent. A monitor that is silent because it is broken looks
# exactly like a monitor that is silent because everything is fine.
#
# Severity has two values and they mean different things to whoever is carrying the
# pager:
#
#   page  — somebody is woken up. Money is wrong, or is about to be.
#   ticket — somebody looks at it during working hours. Something is degraded and
#            is not losing anybody money while it waits.
#
# The `for` clause on every rule is deliberate. A scrape is every fifteen seconds
# and a single bad sample is a scrape that raced a deploy; every threshold here has
# to hold across several before it fires.

groups:
  - name: ideanest-ledger
    interval: 1m
    rules:
      # §8.4's first condition. The reconciliation runs daily and answers three
      # questions; any finding at all is a discrepancy nobody has explained, and
      # `LedgerReconciliation` corrects nothing automatically on purpose.
      #
      # `for: 5m` and not `0m`: the gauge is set by a job that runs once a day, so
      # a finding persists until the next pass — there is no flap to absorb, and the
      # five minutes is only there to stop a page firing from a single scrape taken
      # while an instance was starting.
      - alert: LedgerImbalance
        expr: max(ideanest_ledger_reconciliation_findings) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: The ledger does not reconcile
          description: >-
            The most recent ledger reconciliation found {{ $value }} discrepancy(ies).
            Nothing has been corrected automatically. The service logged one ERROR line
            per finding with the figures in it — search for "Reconciliation finding".
            See apps/api/README.md, "Ledger reconciliation".

      # The failure the first rule cannot see. A reconciliation that stops running
      # leaves `findings` at whatever it last was — zero, on a healthy platform —
      # and the alert above stays green through it for ever.
      #
      # 36 hours: the job is daily, so one missed run is not yet a problem and two
      # are. The series is absent until a pass has run on an instance, which is why
      # `absent()` is checked separately — a fleet that has been restarting for two
      # days has never reconciled and would otherwise publish nothing to alert on.
      - alert: LedgerReconciliationStopped
        expr: >-
          min(ideanest_ledger_reconciliation_age_seconds) > 129600
          or absent(ideanest_ledger_reconciliation_age_seconds)
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: No ledger reconciliation has run recently
          description: >-
            The daily ledger reconciliation has not completed on any instance for more
            than 36 hours, or has never completed since the fleet last restarted. The
            books are unverified rather than known to be wrong.

  - name: ideanest-collections
    interval: 1m
    rules:
      # §8.4's second condition. A rate rather than a count, because ten declines out
      # of ten thousand collections is a Tuesday and ten out of twelve is an incident
      # — CollectionMetrics publishes every outcome for exactly this denominator.
      #
      # `declined` and `failed` and not `provider_unavailable`: that one has its own
      # rule below and is a fact about the provider rather than about the cards.
      # `nothing_due` and `no_provider` are excluded from both sides — they are the
      # job finding nothing to do, and counting them in the denominator would make a
      # quiet hour look like a healthy one.
      - alert: CollectionFailureRate
        expr: >-
          (
            sum(rate(ideanest_payment_collection_attempts_total{outcome=~"declined|failed"}[15m]))
            /
            sum(rate(ideanest_payment_collection_attempts_total{outcome=~"declined|failed|collected"}[15m]))
          ) > 0.25
        for: 15m
        labels:
          severity: page
        annotations:
          summary: More than a quarter of collections are failing
          description: >-
            {{ $value | humanizePercentage }} of collection attempts over the last
            fifteen minutes ended in a decline or a failure. §9.6 retries a declined
            charge, so a rate this high is a provider or a configuration problem rather
            than a run of expired cards.

      # The one that fires when nothing is happening at all. A collection run that
      # has stopped produces no failures, so the rate above goes to zero — which is
      # indistinguishable from a perfect afternoon.
      #
      # Only during a collection window: `charge-processor` runs every minute and has
      # nothing to do most of the time, so this is a ticket rather than a page and is
      # deliberately generous. It catches a job that has been dead for hours, not one
      # that had a quiet ten minutes.
      - alert: NoCollectionsAttempted
        expr: absent(ideanest_payment_collection_attempts_total)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: The collection job is publishing no attempts at all
          description: >-
            No collection attempt of any outcome has been recorded for an hour. The
            counters are registered at start-up, so an absent series means the metrics
            binding is broken rather than that the platform is quiet.

  - name: ideanest-providers
    interval: 1m
    rules:
      # §8.4's third condition. The gauge is the circuit breaker's own view, so this
      # fires when the platform has decided to stop calling a provider rather than
      # when one request failed.
      #
      # A provider that is not configured publishes no series at all — see
      # PlatformMetrics — so this cannot fire for a provider the platform has never
      # had, which is every provider today: §9.3's choice is #60 and is unanswered.
      - alert: PaymentProviderUnavailable
        expr: min by (provider) (ideanest_provider_available) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.provider }} is unavailable"
          description: >-
            The circuit breaker for {{ $labels.provider }} has been open for five
            minutes. Collections against it are being deferred rather than failed —
            §9.6 retries — but nothing is being taken while it stays open.

  - name: ideanest-hosted-payments
    interval: 1m
    rules:
      # #353's sweep settles a payment page whose callback never came, and #356 is here so
      # that it does not do so unnoticed. A few in an hour are a provider's bad hour and the
      # sweep is doing its job; more is callbacks not arriving at all — most likely a wrong
      # callback address — and every backer then waits fifteen minutes or more for a
      # confirmation. A ticket: the money is safe and arrives, just late.
      - alert: HostedPaymentsWithoutCallback
        expr: sum(increase(ideanest_payment_hosted_sweep_settled_total[1h])) > 5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: Payments are being settled without their callback
          description: >-
            The hosted-charge sweep settled {{ $value | humanize }} payment page(s) in the
            last hour whose callback never came. Check the provider's callback address
            (PAYRIFF_CALLBACK_URL, or Epoint's result_url) and that the provider can reach
            /v1/webhooks/psp/{provider}.

      # Paid and given back without the platform hearing of either: the sweep settles it
      # neither way, because whether the pledge stands is a person's decision. The gauge
      # counts such pages within the sweep's seven-day window, so the alert clears by itself
      # after a week whether or not anybody acted — which is why it fires at the first one.
      - alert: HostedPaymentReturnedUnsettled
        expr: max(ideanest_payment_hosted_attention{reason="returned"}) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: A payment was paid and returned without a callback
          description: >-
            {{ $value }} payment page(s) are reported paid and already returned by the
            provider, and their pledges are still drafts. Search the log for
            "paid and returned without a callback" for the pledge and transaction.

      # Pages the provider could not be asked about: unreachable, or taken through a provider
      # that no longer has an adapter here (switching primary turns the old one off). Such a
      # page is asked again every pass until its window ends and is then forgotten, so a
      # count that stays up is a backer who may have paid for a pledge nobody will confirm.
      - alert: HostedPaymentsUnanswerable
        expr: max(ideanest_payment_hosted_attention{reason="unanswered"}) > 0
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: Payment pages cannot be checked with their provider
          description: >-
            {{ $value }} unsettled payment page(s) could not be looked up with their
            provider for an hour. Search the log for "hosted-charge-sweep" to see which
            provider, and whether it is unreachable or has no adapter configured.

  - name: ideanest-queues
    interval: 1m
    rules:
      # Not one of §8.4's three, and here because it is the cheapest way to find out
      # that one of them is about to become true. Every queue on the platform is
      # published by the module that owns it (QueueDepthSource), so a new queue is
      # covered by this rule the day it is added.
      #
      # A dead row is graded harder than a deep queue, and QueueDepthSource explains
      # why: a backlog is a platform under load and a dead row is a platform that has
      # given up and will not recover without somebody.
      - alert: QueueBacklog
        expr: max by (queue) (ideanest_queue_waiting) > 5000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The {{ $labels.queue }} queue is not draining"
          description: >-
            {{ $value }} rows have been waiting in {{ $labels.queue }} for fifteen
            minutes.

      - alert: QueueDeadLetters
        expr: max by (queue) (ideanest_queue_dead) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.queue }} has abandoned work"
          description: >-
            {{ $value }} row(s) in {{ $labels.queue }} ran out of attempts and will not
            be retried. Nothing will pick them up without somebody deciding to.
