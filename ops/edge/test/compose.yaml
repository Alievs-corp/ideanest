# The edge maintenance test rig -- issue #214, section 2. Driven by live.test.mjs;
# not for running on a server.
#
# It reproduces the parts of the Coolify setup that decide what a reader gets when
# the API is down: Traefik with the Docker provider (how Coolify declares
# routers, as container labels) and the file provider (where the shipped
# ops/edge/traefik/edge-maintenance.yaml goes), the edge container built from
# ops/edge, and two stand-ins labelled the way Coolify labels the API and the web.
# The test stops the stand-ins to make the API and the web "go down".
#
# The Traefik image tracks the line Coolify installs. `statusRewrites` in the
# shipped file needs v3.4 or later, so this is also the check that the file loads.
name: ideanest-edge-test

services:
  proxy:
    image: traefik:v3.6
    command:
      - --entryPoints.http.address=:80
      - --entryPoints.https.address=:443
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/dynamic
      - --providers.file.watch=false
      # Coolify's resolver is named `letsencrypt`, and the shipped file refers to
      # it. This one points at an address with nothing on it, so no certificate
      # is ever requested and Traefik serves its default self-signed one.
      - --certificatesResolvers.letsencrypt.acme.email=test@example.com
      - --certificatesResolvers.letsencrypt.acme.storage=/tmp/acme.json
      - --certificatesResolvers.letsencrypt.acme.caServer=https://127.0.0.1:9/directory
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=http
      - --log.level=INFO
    ports:
      - '127.0.0.1:18443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik:/dynamic:ro

  # The name the shipped file's service URLs use.
  ideanest-edge:
    build: ..
    # The image's own check, polled faster so `up --wait` does not sit out the
    # 30-second production interval.
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8079/health']
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    image: nginx:1.30-alpine
    volumes:
      - ./fake-upstream.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 2s
      timeout: 2s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.api-https.rule=Host(`api.ideyanest.com`)
      - traefik.http.routers.api-https.entryPoints=https
      - traefik.http.routers.api-https.tls.certResolver=letsencrypt
      - traefik.http.routers.api-https.middlewares=edge-api-errors@file
      - traefik.http.services.api.loadbalancer.server.port=80

  web:
    image: nginx:1.30-alpine
    volumes:
      - ./fake-upstream.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 2s
      timeout: 2s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.web-https.rule=Host(`ideyanest.com`) || Host(`www.ideyanest.com`)
      - traefik.http.routers.web-https.entryPoints=https
      - traefik.http.routers.web-https.tls.certResolver=letsencrypt
      - traefik.http.routers.web-https.middlewares=edge-web-errors@file
      - traefik.http.services.web.loadbalancer.server.port=80
