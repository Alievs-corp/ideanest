# A stand-in for the API and the web in the edge test (ops/edge/test/compose.yaml).
# It answers the status codes the real services answer, so the test can check
# which of them the edge replaces and which it must leave alone.
server {
    listen 80 default_server;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # The API's own maintenance response. The edge must pass it through untouched.
    location = /v1/__test/api-maintenance {
        add_header Retry-After 600 always;
        add_header Cache-Control no-store always;
        default_type application/problem+json;
        return 503 '{"type":"https://ideanest.az/problems/maintenance","title":"Scheduled maintenance","status":503,"startsAt":"2026-10-04T22:00:00Z","endsAt":"2026-10-04T22:30:00Z","source":"api"}';
    }

    # An ordinary dependency failure. Not maintenance, and must not become it.
    location = /v1/__test/503 {
        default_type application/problem+json;
        return 503 '{"type":"https://ideanest.az/problems/storage-unavailable","status":503}';
    }

    # The API's mail-relay-unavailable. Not maintenance either.
    location = /v1/__test/502 {
        default_type application/problem+json;
        return 502 '{"type":"https://ideanest.az/problems/mail-relay-unavailable","status":502}';
    }

    # What Traefik sends when an upstream times out. The edge takes this one.
    location = /v1/__test/504 {
        return 504;
    }

    location = /__test/504 {
        return 504;
    }

    location / {
        default_type text/plain;
        return 200 "upstream\n";
    }
}
