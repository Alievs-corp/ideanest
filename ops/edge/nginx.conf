# The edge maintenance responder -- issue #214, section 2.
#
# It answers for the API and for the web when neither can answer for itself: the
# container is stopped, restarting, unhealthy, or not accepting connections. It
# is the second of the two sources of the maintenance contract (docs/architecture.md,
# "Maintenance"); the first is the API's own MaintenanceFilter, which answers with
# `source: "api"` and the announced times while the API is running.
#
# HOW IT TELLS AN API REQUEST FROM A WEB REQUEST: by the port it arrives on, not
# by anything in the request.
#
#   8080  the API's answer. Every path and every method gets the problem document.
#   8081  the web's answer. The HTML page, except under /v1/, which the web
#         proxies to the API and which a client reads as JSON.
#
# Traefik has one service per port (ops/edge/traefik/edge-maintenance.yaml), and
# the API router falls back to one while the web router falls back to the other.
# Telling them apart by Host header instead would bake production's host names into
# this file, and a staging copy would answer with the wrong document. Telling them
# apart by path would not work at all: a fallback router forwards the reader's own
# path, and `/` on the API host and `/` on the web host are the same path.
#
# Every response is 503 with `Retry-After: 120` and `Cache-Control: no-store`. The
# 120 is the issue's number for the edge: it has no announced end to count down
# to, and two minutes is short enough that a reader comes back soon after a deploy
# and long enough that a real outage is not hammered by every client.
#
# Runs as the image's unprivileged `nginx` user, so everything that stock nginx
# writes under /run and /var/cache is moved to /tmp.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    # Every response is a 503 that must not be cached; a validator invites a
    # conditional request that has nothing to validate.
    etag off;
    keepalive_timeout 15;

    # Nothing is served from disk under its own name. Each server block answers
    # every request with `return 503`, and `error_page` swaps in the body from
    # one of the two internal locations below. That also turns every method into
    # a GET for the body, so a POST gets the same document as a GET instead of
    # nginx's 405 for a static file.
    root /usr/share/nginx/edge;

    # --- API: port 8080 --------------------------------------------------------
    server {
        listen 8080 default_server;

        error_page 503 /__edge/problem.json;
        # Someone asking for the internal path by name still gets the contract,
        # not nginx's 404 page.
        error_page 404 =503 /__edge/problem.json;

        location / {
            return 503;
        }

        location = /__edge/problem.json {
            internal;
            alias /usr/share/nginx/edge/problem.json;
            types { }
            default_type application/problem+json;
            include /etc/nginx/edge-headers.conf;
        }
    }

    # --- Web: port 8081 --------------------------------------------------------
    server {
        listen 8081 default_server;

        error_page 503 /__edge/maintenance.html;
        error_page 404 =503 /__edge/maintenance.html;

        location / {
            return 503;
        }

        # The web serves the API under its own origin (apps/web/next.config.ts,
        # `rewrites`), so a browser's API call arrives on the web host. It gets
        # the problem document, not a page it cannot parse.
        location /v1/ {
            error_page 503 /__edge/problem.json;
            return 503;
        }

        location = /__edge/maintenance.html {
            internal;
            alias /usr/share/nginx/edge/maintenance.html;
            types { }
            default_type text/html;
            charset utf-8;
            include /etc/nginx/edge-headers.conf;
            # The page has no scripts, no images and no external styles; it is
            # allowed exactly what it uses.
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        }

        location = /__edge/problem.json {
            internal;
            alias /usr/share/nginx/edge/problem.json;
            types { }
            default_type application/problem+json;
            include /etc/nginx/edge-headers.conf;
        }
    }

    # --- Liveness, loopback only ------------------------------------------------
    # For the container's HEALTHCHECK. It is on its own loopback port so that no
    # request through the proxy can reach a 200 from this container.
    server {
        listen 127.0.0.1:8079;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
