# Headers every edge maintenance response carries -- the contract in issue #214.
#
# `always` is required: without it nginx adds headers to 2xx and 3xx responses
# only, and every response from this container is a 503.
#
# Retry-After is fixed at 120 seconds. The API computes its own from the announced
# end; the edge has no end to count to (`endsAt: null`), so it asks clients to
# come back in two minutes. `ops/edge/test/static.test.mjs` checks that this value
# and the HTML page's refresh interval agree.
add_header Retry-After 120 always;
add_header Cache-Control no-store always;
add_header X-Content-Type-Options nosniff always;
