name: CI

# WHY THE JOBS ARE GATED AND THIS WORKFLOW IS NOT — issue #67.
#
# This repository is a monorepo and CI was not. Every job here ran on every
# pull request, so a CSS change under `apps/web` ran the full Java suite and a
# typo in `docs/` ran the entire pipeline. Over the two days after the
# repository was created that came to 1,642 billable minutes out of a 2,000
# minute monthly allowance, and Actions were switched off mid-week.
#
# The obvious fix is the one `mobile-release.yml` uses: a `paths:` filter on
# `on:`. IT WOULD BREAK THE REPOSITORY. Branch protection on `main` names status
# checks -- it named `Frontend (typecheck, test, storybook)` and `Backend (Java)`
# when this was written -- and A REQUIRED CHECK THAT NEVER RUNS IS REPORTED AS
# *PENDING*, NOT AS *PASSED*. A workflow-level `paths:` filter would therefore
# leave every pull request that did not happen to touch those paths waiting for
# ever on a check that was never going to arrive. There is no timeout on that
# wait and no message saying what happened. Whoever reaches for `paths:` here
# next: this is what you are about to do.
#
# So the shape here is: always run the workflow, conditionally do the work,
# always report. A cheap `changes` job classifies the diff, each heavy job
# carries an `if:` on the result, and `CI complete` runs whatever happened and
# is the check branch protection is meant to require. A skipped job is a job
# `CI complete` reports as skipped and passes on; a failed one fails it.
#
# The same reasoning is already written down one job below, where `backend`
# detects `apps/api` in a step rather than a job-level condition "to keep the
# check name stable as a required check". This generalises that.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # What changed. Everything below reads this.
  # ---------------------------------------------------------------------------
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # `dorny/paths-filter` reads a pull request's file list from the REST API
      # rather than from a working tree, and that read needs saying out loud:
      # the workflow-level grant above is `contents: read` alone.
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      # A pull request needs no working tree — the file list comes from the API.
      # A push does: it is diffed with git against the commit `main` pointed at
      # before the push, and git cannot diff against a commit it never fetched.
      # So the checkout happens for pushes only, and the common case stays a
      # job that finishes in seconds.
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # WHAT BELONGS IN WHICH FILTER, AND WHY IT IS NOT ONE DIRECTORY EACH.
          #
          # `packages/**` is consumed by `apps/web` and by `apps/mobile`, and a
          # change to a lockfile can move a transitive dependency under either,
          # so the JavaScript filters share an anchor rather than pretending the
          # workspace is separable. `apps/api` is a Gradle build that shares
          # none of it, which is exactly why it is worth skipping: it is the
          # 547 minutes that had the least reason to be spent.
          #
          # `.github/workflows/ci.yml` is in both. Editing this file has to run
          # everything it describes, or the edit is unreviewable.
          filters: |
            shared: &shared
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            web:
              - *shared
              - 'apps/web/**'
            mobile:
              - *shared
              - 'apps/mobile/**'
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**/*.md'

      # A grey check with no explanation is a check people stop trusting. This
      # puts the reason in the run summary, next to the jobs it explains, so
      # "why did the backend not run" is answerable without reading this file.
      - name: Say what will run, and what will not
        env:
          WEB: ${{ steps.filter.outputs.web }}
          API: ${{ steps.filter.outputs.api }}
          MOBILE: ${{ steps.filter.outputs.mobile }}
          DOCS: ${{ steps.filter.outputs.docs }}
        run: |
          set -euo pipefail
          {
            echo '## What this run will do'
            echo
            echo '| Component | Changed | Jobs |'
            echo '|---|---|---|'
            echo "| Web and shared packages | ${WEB} | Frontend, Storybook preview, Performance budgets |"
            echo "| Backend (\`apps/api\`) | ${API} | Backend (Java) |"
            echo "| Mobile (\`apps/mobile\`) | ${MOBILE} | covered by \`mobile-release.yml\` |"
            echo "| Documentation | ${DOCS} | none of its own |"
            echo
            echo "A job listed against an unchanged component is skipped, and \`CI complete\`"
            echo "passes on a skip. See the header comment in \`.github/workflows/ci.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (typecheck, test, storybook)
    runs-on: ubuntu-latest
    needs: changes
    # `pnpm -r` walks the whole workspace, so this job is the typecheck and the
    # test run for `apps/mobile` as well as for `apps/web` — which is why the
    # gate is `web` (shared packages included) rather than `apps/web/**`. A
    # change that touches only `apps/mobile` skips this and is checked by
    # `mobile-release.yml`'s `Mobile (typecheck, test, config)` instead, which
    # runs the same two commands against the same package. Nothing stops being
    # checked; it stops being checked twice.
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Building every story is the cheapest proof that no component throws
      # at render time. It has already caught more than one regression.
      - name: Build Storybook
        run: pnpm --filter @ideanest/ui build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  # Reviewers get a browsable build instead of a description of one. It reuses
  # the artifact the frontend job already produced rather than building twice.
  storybook-preview:
    name: Storybook preview
    runs-on: ubuntu-latest
    needs: frontend
    # A pull request from a fork is handed a read-only token, and handing an
    # untrusted branch a write token in exchange for a preview URL is not a
    # trade worth making. Such pull requests simply get no preview.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Work out where this build belongs
        id: target
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: build

      # THE PREVIEW BRANCH IS ORPHANED, AND UNTIL SOMETHING CREATES IT, IT DOES
      # NOT EXIST. `ref: gh-pages` does not degrade when it is missing — the
      # checkout fails outright — so this job was red on every pull request
      # this repository has ever opened, for want of a branch nobody was told
      # to create. A workflow that only runs once somebody has hand-seeded a
      # branch is a workflow that is broken in a fresh clone and in every fork.
      #
      # So the repository is checked out at the commit under test, which is
      # what wires up the credentials, and the step below either fetches the
      # preview branch or starts it.
      - uses: actions/checkout@v7
        with:
          path: pages
          fetch-depth: 1

      - name: Check out the preview branch, starting it the first time
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages origin/gh-pages
            exit 0
          fi

          # Orphaned deliberately. The previews share no history with the source
          # tree, and a branch that carried it would put a second copy of the
          # repository behind every directory of built HTML.
          echo '::notice::No preview branch yet — starting one.'
          git checkout --orphan gh-pages
          git rm -rf --quiet .
          # Storybook emits directories beginning with an underscore, which
          # Jekyll would strip before serving them.
          touch .nojekyll
          git add -A
          git commit -q -m 'chore(ci): start the storybook preview branch'
          git push origin gh-pages

      - name: Publish to the preview branch
        working-directory: pages
        env:
          DIR: ${{ steps.target.outputs.dir }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Several runs can finish at once. The loser of a push race rebuilds
          # its commit on top of the winner instead of force-pushing over it,
          # which would delete a sibling pull request's preview.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin gh-pages
            git reset --hard origin/gh-pages

            rm -rf "$DIR"
            mkdir -p "$DIR"
            cp -R ../build/. "$DIR/"
            # Storybook emits directories beginning with an underscore, which
            # Jekyll would strip before serving them.
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "::notice::Preview is already current; nothing to publish."
              exit 0
            fi

            git commit -q -m "chore(ci): publish storybook to ${DIR}" \
                          -m "Built from ${SOURCE_SHA}."

            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected — another run got there first. Retry ${attempt}."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not publish the Storybook preview after 5 attempts."
          exit 1

      - name: Leave the URL on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Derived, not hard-coded, so a rename or a transfer does not leave
          # every pull request pointing at a URL that no longer resolves.
          URL: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.dir }}/
        run: |
          set -euo pipefail
          MARKER='<!-- storybook-preview -->'
          BODY=$(printf '%s\n📖 **Storybook preview:** %s\n\nBuilt from `%s`. Republished on every push; the directory is removed when this pull request closes.' \
            "$MARKER" "$URL" "${GITHUB_SHA:0:7}")

          # One comment, edited in place. A fresh comment per push would bury
          # the review conversation under a changelog of itself.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$BODY" > /dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -f body="$BODY" > /dev/null
          fi

  # First Load JS is a property of the build — the same commit produces the same
  # bytes on every machine — so a failure here is always somebody's change and
  # never the runner's mood. That is what makes it safe to block on.
  #
  # A separate job rather than more steps on `frontend`: it wants its own name
  # as a required check, and building the web application is a couple of minutes
  # the typecheck-and-test job should not have to carry inside its timeout.
  # Nothing here needs a token beyond the read-only one, so it runs on a fork's
  # pull request exactly as it runs on ours.
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web application
        run: pnpm --filter @ideanest/web build

      # The gate. Everything below this step reports; only this step fails.
      - name: Check First Load JS against budgets
        run: node apps/web/performance/check-first-load-js.mjs

      # A production build that does not serve a page is a defect and not
      # runner noise, so this one is allowed to fail the job even though the
      # measurement it exists for is not.
      - name: Start the production server
        env:
          LOG: ${{ runner.temp }}/next-start.log
        run: |
          pnpm --filter @ideanest/web start > "$LOG" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sfo /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The production server did not answer within 30 seconds."
          cat "$LOG"
          exit 1

      # The home page is the platform's front door and the one route whose motion
      # budget is Full (motion-system.md §5); discovery is the surface with the most
      # on screen, and the editor the one with the most form. The root route was
      # absent from this list with a comment saying it did not exist -- #264 built
      # it, and the page a first-time visitor meets is the one worth watching most.
      #
      # Lighthouse is fetched with `pnpm dlx` at a pinned version rather than
      # installed, because a tool that runs twice a day in CI does not belong in
      # the dependency graph of an application nobody installs it with.
      #
      # Three runs each. A single Lighthouse run on a shared runner is a sample,
      # not a measurement, and one that fails is one missing sample rather than
      # a broken pull request.
      - name: Measure lab Core Web Vitals
        env:
          REPORTS: ${{ runner.temp }}/lighthouse
        run: |
          mkdir -p "$REPORTS"
          # An empty entry is the home page. Quoted, so the shell keeps it as an
          # argument rather than dropping it from the list.
          for route in "" discover projects/new; do
            # The report file name: the home page is `home`, and a nested route
            # flattens its slashes, because a report written to a directory that
            # does not exist is a run that silently produced nothing.
            name="${route:-home}"
            name="${name//\//-}"
            for run in 1 2 3; do
              pnpm dlx lighthouse@13.4.1 "http://localhost:3000/${route}" \
                --only-categories=performance \
                --output=json \
                --output-path="${REPORTS}/${name}-${run}.json" \
                --chrome-flags='--headless=new --no-sandbox' \
                --quiet \
                || echo "::warning title=Lighthouse::${name} run ${run} did not complete."
            done
          done

      - name: Summarise lab Core Web Vitals
        run: node apps/web/performance/summarise-lighthouse.mjs "${{ runner.temp }}/lighthouse"

      # The table in the job summary is the median. The reports are what you
      # read when the median is surprising and you want to know which run moved.
      - name: Upload the Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    needs: changes
    # The Gradle build shares nothing with the JavaScript workspace, which is
    # what makes this the cheapest 500 minutes in the file to stop spending:
    # over the 96 runs measured in #67 it had a reason to run on 44 of them.
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The service does not exist yet. Detecting it in a step rather than a
      # job-level condition keeps the check name stable as a required check,
      # and `hashFiles` is not available before checkout anyway.
      - name: Detect backend
        id: detect
        run: |
          if [ -f apps/api/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api not present yet; skipping the backend build."
          fi

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # §13.1's ingestion shells out to libvips, and the runtime image installs it
      # for the same reason -- see apps/api/Dockerfile on why the JDK's own ImageIO
      # was not enough.
      #
      # HERE SO THAT THE TRANSCODER TESTS ACTUALLY RUN. They are guarded on the
      # binary being present, which is what lets somebody work on this repository
      # without installing it; without this step that guard would quietly skip them
      # in CI as well, and a test that never runs anywhere is a test that is not
      # there. The EXIF assertion in particular is a privacy claim, and it has to be
      # made against real output.
      - name: Install libvips
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips-tools

      - name: Build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        run: ./gradlew --no-daemon build

  # ---------------------------------------------------------------------------
  # The single check branch protection should require.
  #
  # WHY THIS EXISTS AT ALL. A required status check that never runs is reported
  # as pending and blocks the merge for ever, so the moment any job above became
  # conditional, `Frontend (typecheck, test, storybook)` and `Backend (Java)`
  # stopped being safe things to require by name. This job is not conditional
  # and cannot be: `if: always()` runs it after a success, a failure, a skip and
  # a cancellation alike, so there is always exactly one context to require and
  # it always arrives.
  #
  # WHAT IT BLOCKS ON, AND WHY THAT LIST IS SHORTER THAN `needs`. It waits for
  # every job, and it fails on the two that branch protection required before
  # this change. `Performance budgets` and `Storybook preview` report and do not
  # block, which is what they already did -- neither has ever been a required
  # context. Making the budget check blocking here would be a good idea and it
  # would also be a change to what may be merged, which is not a thing to slip
  # into a pull request about billing. #67 puts it to the administrator who has
  # to touch branch protection anyway; the change is one entry in the list below.
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [changes, frontend, storybook-preview, performance, backend]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Report on the jobs this change needed
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          STORYBOOK: ${{ needs['storybook-preview'].result }}
        run: |
          set -euo pipefail

          # `skipped` is a pass. That is the entire point of the job: a backend
          # that did not run because nothing under `apps/api` changed has not
          # failed to verify anything, and saying otherwise would re-create the
          # stuck pull request this job exists to prevent.
          #
          # `cancelled` is not a pass. A superseded run is cancelled by the
          # concurrency group above and must not report green on a commit whose
          # tests were killed half way through.
          failed=0
          for entry in "Frontend (typecheck, test, storybook):${FRONTEND}"                        "Backend (Java):${BACKEND}"                        "Changed paths:${CHANGES}"; do
            job="${entry%:*}"
            result="${entry##*:}"
            case "$result" in
              success|skipped) echo "::notice::${job}: ${result}" ;;
              *)               echo "::error::${job}: ${result}"; failed=1 ;;
            esac
          done

          # Reported, not judged. Both of these are visible as their own checks
          # on the pull request and a reviewer can see them there.
          echo "::notice::Performance budgets: ${PERFORMANCE} (advisory here)"
          echo "::notice::Storybook preview: ${STORYBOOK} (advisory here)"

          if [ "$failed" -ne 0 ]; then
            echo "::error title=CI::A job this change needed did not succeed."
            exit 1
          fi
          echo 'Every job this change needed either passed or had nothing to do.'
