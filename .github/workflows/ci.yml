name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels the previous run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (typecheck, test, storybook)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Building every story is the cheapest proof that no component throws
      # at render time. It has already caught more than one regression.
      - name: Build Storybook
        run: pnpm --filter @ideanest/ui build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 7

  # Reviewers get a browsable build instead of a description of one. It reuses
  # the artifact the frontend job already produced rather than building twice.
  storybook-preview:
    name: Storybook preview
    runs-on: ubuntu-latest
    needs: frontend
    # A pull request from a fork is handed a read-only token, and handing an
    # untrusted branch a write token in exchange for a preview URL is not a
    # trade worth making. Such pull requests simply get no preview.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Work out where this build belongs
        id: target
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            echo "dir=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: build

      # THE PREVIEW BRANCH IS ORPHANED, AND UNTIL SOMETHING CREATES IT, IT DOES
      # NOT EXIST. `ref: gh-pages` does not degrade when it is missing — the
      # checkout fails outright — so this job was red on every pull request
      # this repository has ever opened, for want of a branch nobody was told
      # to create. A workflow that only runs once somebody has hand-seeded a
      # branch is a workflow that is broken in a fresh clone and in every fork.
      #
      # So the repository is checked out at the commit under test, which is
      # what wires up the credentials, and the step below either fetches the
      # preview branch or starts it.
      - uses: actions/checkout@v7
        with:
          path: pages
          fetch-depth: 1

      - name: Check out the preview branch, starting it the first time
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git checkout -B gh-pages origin/gh-pages
            exit 0
          fi

          # Orphaned deliberately. The previews share no history with the source
          # tree, and a branch that carried it would put a second copy of the
          # repository behind every directory of built HTML.
          echo '::notice::No preview branch yet — starting one.'
          git checkout --orphan gh-pages
          git rm -rf --quiet .
          # Storybook emits directories beginning with an underscore, which
          # Jekyll would strip before serving them.
          touch .nojekyll
          git add -A
          git commit -q -m 'chore(ci): start the storybook preview branch'
          git push origin gh-pages

      - name: Publish to the preview branch
        working-directory: pages
        env:
          DIR: ${{ steps.target.outputs.dir }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Several runs can finish at once. The loser of a push race rebuilds
          # its commit on top of the winner instead of force-pushing over it,
          # which would delete a sibling pull request's preview.
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin gh-pages
            git reset --hard origin/gh-pages

            rm -rf "$DIR"
            mkdir -p "$DIR"
            cp -R ../build/. "$DIR/"
            # Storybook emits directories beginning with an underscore, which
            # Jekyll would strip before serving them.
            touch .nojekyll

            git add -A
            if git diff --cached --quiet; then
              echo "::notice::Preview is already current; nothing to publish."
              exit 0
            fi

            git commit -q -m "chore(ci): publish storybook to ${DIR}" \
                          -m "Built from ${SOURCE_SHA}."

            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push rejected — another run got there first. Retry ${attempt}."
            sleep $(( attempt * 5 ))
          done

          echo "::error::Could not publish the Storybook preview after 5 attempts."
          exit 1

      - name: Leave the URL on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Derived, not hard-coded, so a rename or a transfer does not leave
          # every pull request pointing at a URL that no longer resolves.
          URL: >-
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ steps.target.outputs.dir }}/
        run: |
          set -euo pipefail
          MARKER='<!-- storybook-preview -->'
          BODY=$(printf '%s\n📖 **Storybook preview:** %s\n\nBuilt from `%s`. Republished on every push; the directory is removed when this pull request closes.' \
            "$MARKER" "$URL" "${GITHUB_SHA:0:7}")

          # One comment, edited in place. A fresh comment per push would bury
          # the review conversation under a changelog of itself.
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq "[.[] | select(.body | startswith(\"${MARKER}\")) | .id] | first // empty")

          if [ -n "$existing" ]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -f body="$BODY" > /dev/null
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              -f body="$BODY" > /dev/null
          fi

  # First Load JS is a property of the build — the same commit produces the same
  # bytes on every machine — so a failure here is always somebody's change and
  # never the runner's mood. That is what makes it safe to block on.
  #
  # A separate job rather than more steps on `frontend`: it wants its own name
  # as a required check, and building the web application is a couple of minutes
  # the typecheck-and-test job should not have to carry inside its timeout.
  # Nothing here needs a token beyond the read-only one, so it runs on a fork's
  # pull request exactly as it runs on ours.
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web application
        run: pnpm --filter @ideanest/web build

      # The gate. Everything below this step reports; only this step fails.
      - name: Check First Load JS against budgets
        run: node apps/web/performance/check-first-load-js.mjs

      # A production build that does not serve a page is a defect and not
      # runner noise, so this one is allowed to fail the job even though the
      # measurement it exists for is not.
      - name: Start the production server
        env:
          LOG: ${{ runner.temp }}/next-start.log
        run: |
          pnpm --filter @ideanest/web start > "$LOG" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sfo /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::The production server did not answer within 30 seconds."
          cat "$LOG"
          exit 1

      # The home page is the platform's front door and the one route whose motion
      # budget is Full (motion-system.md §5); discovery is the surface with the most
      # on screen, and the editor the one with the most form. The root route was
      # absent from this list with a comment saying it did not exist -- #264 built
      # it, and the page a first-time visitor meets is the one worth watching most.
      #
      # Lighthouse is fetched with `pnpm dlx` at a pinned version rather than
      # installed, because a tool that runs twice a day in CI does not belong in
      # the dependency graph of an application nobody installs it with.
      #
      # Three runs each. A single Lighthouse run on a shared runner is a sample,
      # not a measurement, and one that fails is one missing sample rather than
      # a broken pull request.
      - name: Measure lab Core Web Vitals
        env:
          REPORTS: ${{ runner.temp }}/lighthouse
        run: |
          mkdir -p "$REPORTS"
          # An empty entry is the home page. Quoted, so the shell keeps it as an
          # argument rather than dropping it from the list.
          for route in "" discover projects/new; do
            # The report file name: the home page is `home`, and a nested route
            # flattens its slashes, because a report written to a directory that
            # does not exist is a run that silently produced nothing.
            name="${route:-home}"
            name="${name//\//-}"
            for run in 1 2 3; do
              pnpm dlx lighthouse@13.4.1 "http://localhost:3000/${route}" \
                --only-categories=performance \
                --output=json \
                --output-path="${REPORTS}/${name}-${run}.json" \
                --chrome-flags='--headless=new --no-sandbox' \
                --quiet \
                || echo "::warning title=Lighthouse::${name} run ${run} did not complete."
            done
          done

      - name: Summarise lab Core Web Vitals
        run: node apps/web/performance/summarise-lighthouse.mjs "${{ runner.temp }}/lighthouse"

      # The table in the job summary is the median. The reports are what you
      # read when the median is surprising and you want to know which run moved.
      - name: Upload the Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/lighthouse
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The service does not exist yet. Detecting it in a step rather than a
      # job-level condition keeps the check name stable as a required check,
      # and `hashFiles` is not available before checkout anyway.
      - name: Detect backend
        id: detect
        run: |
          if [ -f apps/api/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api not present yet; skipping the backend build."
          fi

      - uses: actions/setup-java@v6
        if: steps.detect.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # §13.1's ingestion shells out to libvips, and the runtime image installs it
      # for the same reason -- see apps/api/Dockerfile on why the JDK's own ImageIO
      # was not enough.
      #
      # HERE SO THAT THE TRANSCODER TESTS ACTUALLY RUN. They are guarded on the
      # binary being present, which is what lets somebody work on this repository
      # without installing it; without this step that guard would quietly skip them
      # in CI as well, and a test that never runs anywhere is a test that is not
      # there. The EXIF assertion in particular is a privacy claim, and it has to be
      # made against real output.
      - name: Install libvips
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvips-tools

      - name: Build and test
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/api
        run: ./gradlew --no-daemon build
