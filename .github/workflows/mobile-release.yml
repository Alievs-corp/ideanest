name: Mobile release

# Builds and distributes `apps/mobile` — §19.2.
#
# WHY THIS IS A SEPARATE WORKFLOW FROM `release.yml`.
#
# That one builds container images and deploys a digest, and its central property
# is that nothing is built twice: staging and production run the same bytes, and
# a rollback is a redeploy of yesterday's digest. A mobile build cannot have that
# property. A store build is signed for the store and an internal build is not,
# so the artefact that testers approve is never the artefact that ships — the two
# differ in the one way that matters to Apple and Google. Pretending otherwise by
# sharing a workflow would make the difference invisible rather than absent.
#
# WHAT IS DELIBERATELY NOT HERE: a build.
#
# Compiling a React Native application needs Xcode and the Android SDK, and this
# repository owns neither a macOS runner nor the signing material. `eas build`
# runs on Expo's infrastructure and holds the credentials, which is what EAS is
# for. So every job below either checks something this repository can check, or
# asks EAS to do the work AND SAYS SO AND STOPS when no token is configured —
# the same rule `release.yml`'s deploy step, the metrics endpoint and the cache
# invalidator all follow. A workflow that failed on every push because a secret
# nobody has set is missing is a workflow people learn to ignore.

on:
  # The checks that used to run here on every push and pull request live in
  # `mobile-check.yml` and are called from `ci.yml` (#144), where `CI complete`
  # waits for them. What is left is the build, which only a person starts.
  # A store build is a deliberate act with a human behind it. It is never a
  # consequence of merging.
  #
  # An over-the-air update is the same: `operation: update` publishes the
  # JavaScript of this commit to one channel (§4.12 MB-13), and nothing
  # publishes one on merge. `runtimeVersion` is a fingerprint of the native
  # inputs, so an update only ever reaches builds whose native code it matches;
  # a change that needs a new binary needs `operation: build`.
  workflow_dispatch:
    inputs:
      operation:
        description: Build binaries with EAS Build, publish an over-the-air update with EAS Update, or put an Android APK on GitHub Releases
        required: true
        type: choice
        options: [build, update, github-release]
        default: build
      profile:
        description: Which eas.json build profile to build, or which channel to update (the names are the same). github-release always builds github
        required: true
        type: choice
        options: [preview, production, github]
      submit:
        description: "build only: submit the finished build to the stores"
        required: false
        type: boolean
        default: false
      rollout:
        description: "update only: the percentage of the channel's phones that get the update (1-100)"
        required: false
        type: number
        default: 10
      message:
        description: "update only: what changed, as the update's message"
        required: false
        type: string
      build_id:
        description: "github-release only: the id of a finished EAS build of the github profile, to publish instead of building again"
        required: false
        type: string

concurrency:
  # One mobile build, or one update, at a time per ref and profile. Two
  # overlapping builds burn two EAS build minutes to produce one artefact
  # anybody wants. An update must not cancel a build, and a production dispatch
  # must not cancel a preview one, so the operation and the profile are both
  # part of the group.
  group: mobile-release-${{ inputs.operation }}-${{ inputs.profile }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # The same checks a pull request runs, against the commit about to be built.
  # A build of a commit whose tests are red is EAS minutes spent on an artefact
  # nobody should install.
  # ---------------------------------------------------------------------------
  check:
    uses: ./.github/workflows/mobile-check.yml

  # ---------------------------------------------------------------------------
  # The build, on Expo's infrastructure.
  # ---------------------------------------------------------------------------
  build:
    name: EAS build (${{ inputs.profile || 'preview' }})
    if: inputs.operation == 'build'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    environment: mobile
    steps:
      - name: Refuse the GitHub profile
        if: inputs.profile == 'github'
        run: |
          echo "::error::The github profile is built by operation github-release, which also publishes the APK."
          exit 1

      - uses: actions/checkout@v7
        with:
          # `eas.json` sets `requireCommit`, so the build is identified by the
          # commit that produced it. A shallow checkout with no history is one
          # EAS refuses.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Say so and stop when EAS is not configured
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; no build was requested. See apps/mobile/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # The profile's `eas.json` environment, so `app.config.ts` evaluates here
      # exactly as it will on the build worker (see the script). Every input
      # reaches a script through `env:`, never spliced into it: a dispatch input
      # is text somebody typed, and `${{ }}` inside `run:` would execute it.
      - name: Export the profile's environment
        env:
          PROFILE: ${{ inputs.profile }}
        run: node apps/mobile/scripts/eas-profile-env.mjs "$PROFILE" >> "$GITHUB_ENV"

      - name: Build
        if: steps.eas.outputs.configured == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILE: ${{ inputs.profile }}
        # `--non-interactive` because a prompt on a runner is a job that times
        # out an hour later with nothing to show. `--no-wait` is deliberately
        # NOT passed: a workflow that queues a build and reports success has
        # reported on the queue rather than on the build.
        run: pnpm dlx eas-cli@latest build --platform all --profile "$PROFILE" --non-interactive

      # The App Store Connect app id and the Apple team id are the owner's
      # account details, so they are repository secrets rather than literals in
      # `eas.json`, and `eas submit` reads neither from the environment. They are
      # written into the submit profile on the runner, never committed. Without
      # them iOS is not submitted, and the job says so.
      - name: Decide which stores to submit to
        id: stores
        if: steps.eas.outputs.configured == 'true' && inputs.submit
        env:
          ASC_APP_ID: ${{ secrets.IDEANEST_ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ secrets.IDEANEST_APPLE_TEAM_ID }}
          PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$PROFILE" != "production" ]; then
            echo "::notice::Only production builds are submitted; a $PROFILE build is installed from EAS."
            echo "platform=none" >> "$GITHUB_OUTPUT"
          elif [ -z "$ASC_APP_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::notice::IDEANEST_ASC_APP_ID or IDEANEST_APPLE_TEAM_ID is not set; submitting Android only. See apps/mobile/README.md."
            echo "platform=android" >> "$GITHUB_OUTPUT"
          else
            node -e '
              const fs = require("node:fs");
              const file = "apps/mobile/eas.json";
              const eas = JSON.parse(fs.readFileSync(file, "utf8"));
              eas.submit.production.ios = {
                ...eas.submit.production.ios,
                ascAppId: process.env.ASC_APP_ID,
                appleTeamId: process.env.APPLE_TEAM_ID,
              };
              fs.writeFileSync(file, JSON.stringify(eas, null, 2) + "\n");
            '
            echo "platform=all" >> "$GITHUB_OUTPUT"
          fi

      # Nothing reaches a store without the device suite (#165): the newest finished run of
      # apps/mobile/.eas/workflows/e2e.yml on EAS must have succeeded, within the last two days.
      # That workflow says why it runs nightly and not per pull request (#67).
      - name: Require a green end-to-end run
        if: steps.eas.outputs.configured == 'true' && inputs.submit
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm dlx eas-cli@latest workflow:runs --workflow e2e.yml --limit 20 --json > "$RUNNER_TEMP/e2e-runs.json"
          node -e '
            const runs = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const last = runs.find((run) => ["SUCCESS", "FAILURE", "CANCELED"].includes(run.status));
            const age = last ? Date.now() - Date.parse(last.finishedAt ?? last.startedAt) : Infinity;
            if (!last || last.status !== "SUCCESS" || age > 48 * 3600 * 1000) {
              console.log(`::error::No submission: the latest end-to-end run is ${last ? `${last.status}, finished ${last.finishedAt}` : "missing"}; it must be SUCCESS within 48 hours. Run e2e.yml on EAS first.`);
              process.exit(1);
            }
            console.log(`End-to-end run ${last.id} succeeded at ${last.finishedAt}.`);
          ' "$RUNNER_TEMP/e2e-runs.json"

      # Staged rollout — §19.2's shape, as the stores express it. `eas.json`
      # submits Android to the `internal` track as a draft, which is what makes
      # the rollout a decision somebody takes in Play Console rather than a
      # consequence of this workflow finishing. iOS goes to TestFlight, and
      # release to the App Store stays a decision in App Store Connect.
      - name: Submit
        if: steps.eas.outputs.configured == 'true' && inputs.submit && steps.stores.outputs.platform != 'none'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.IDEANEST_APPLE_TEAM_ID }}
          PLATFORM: ${{ steps.stores.outputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: pnpm dlx eas-cli@latest submit --platform "$PLATFORM" --profile "$PROFILE" --latest --non-interactive

  # ---------------------------------------------------------------------------
  # An over-the-air update (§4.12 MB-13), to one channel, to a percentage of it.
  #
  # Never on merge: an update reaches phones within a launch, with no review
  # in between, so it is the same deliberate act a store build is. Raise the
  # percentage afterwards with `eas update:edit`, or publish again; see
  # apps/mobile/README.md.
  # ---------------------------------------------------------------------------
  update:
    name: EAS update (${{ inputs.profile || 'preview' }}, ${{ inputs.rollout || 10 }}%)
    if: inputs.operation == 'update'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    environment: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the channel's build environment
        env:
          PROFILE: ${{ inputs.profile }}
        run: node apps/mobile/scripts/eas-profile-env.mjs "$PROFILE" >> "$GITHUB_ENV"

      - name: Say so and stop when EAS Update is not configured
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ROLLOUT: ${{ inputs.rollout }}
        run: |
          if ! [[ "$ROLLOUT" =~ ^[0-9]+$ ]] || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
            echo "::error::rollout must be a whole number from 1 to 100, not '$ROLLOUT'."
            exit 1
          fi
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; no update was published. See apps/mobile/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${IDEANEST_EAS_PROJECT_ID:-}" ]; then
            echo "::notice::eas.json sets no IDEANEST_EAS_PROJECT_ID, so builds have updates switched off and none would receive this. See apps/mobile/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # `--environment` loads the EAS environment variables the channel's
      # builds were made with (the provider sign-ins, for one), for the reason
      # the export step above gives: a different evaluation is a different
      # fingerprint, and an update for a runtime no phone runs.
      - name: Publish the update
        if: steps.eas.outputs.configured == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CHANNEL: ${{ inputs.profile }}
          # EAS has three environments; the github channel's builds use production's (eas.json).
          ENVIRONMENT: ${{ inputs.profile == 'github' && 'production' || inputs.profile }}
          ROLLOUT: ${{ inputs.rollout }}
          MESSAGE: ${{ inputs.message || format('Update from {0}', github.sha) }}
        run: >-
          pnpm dlx eas-cli@latest update
          --channel "$CHANNEL"
          --environment "$ENVIRONMENT"
          --rollout-percentage "$ROLLOUT"
          --message "$MESSAGE"
          --non-interactive

      # The update's source maps, so a crash in the JavaScript it shipped is
      # symbolicated (#165). `eas update` exported the bundles and their maps
      # into `dist`; Sentry's own script uploads them with the debug ids Metro
      # wrote into both. Without SENTRY_AUTH_TOKEN there is nothing to upload
      # with, and the update is already published, so the step says so and
      # stops rather than failing. SENTRY_ORG and SENTRY_PROJECT (and SENTRY_URL
      # for a GlitchTip) are environment variables, the token a secret.
      - name: Upload the update's source maps to Sentry
        if: steps.eas.outputs.configured == 'true'
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN is not set; the update's source maps were not uploaded. See apps/mobile/README.md."
            exit 0
          fi
          if [ -z "$SENTRY_URL" ]; then unset SENTRY_URL; fi
          pnpm exec sentry-expo-upload-sourcemaps dist

  # An installable Android APK on the repository's Releases page.
  #
  # Until the app is in Google Play, this is how somebody outside the team
  # installs it: download the APK from the release and open it. It is the
  # `github` profile, which is production in every way that matters (the
  # production API, crash reporting, updates switched on) except that it is an
  # APK rather than a store bundle and listens on its own `github` channel.
  # It is its own channel because the profile name is part of `extra`, and so
  # part of the fingerprint: a production update would never match it. Publish
  # an over-the-air update to it with `operation: update`, `profile: github`.
  #
  # EAS holds the signing key: the first build generates it, every later one
  # reuses it, so a newer APK installs over an older one.
  #
  # The tag is `android-v<version>-<versionCode>`, never `v*`: `release.yml`
  # deploys production on a `v*` tag, and an APK must not do that.
  github-release:
    name: Android APK on GitHub Releases
    if: inputs.operation == 'github-release'
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    environment: mobile
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the profile's environment
        run: node apps/mobile/scripts/eas-profile-env.mjs github android >> "$GITHUB_ENV"

      - name: Say so and stop when EAS is not configured
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice::EXPO_TOKEN is not set; no APK was built. See apps/mobile/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # A build that outlives this job still finishes on EAS: the free queue
      # alone can take most of an hour. `build_id` publishes that build rather
      # than paying for a second one, and is refused unless it is an Android
      # build of the github profile, so nothing else reaches the Releases page.
      - name: Build the APK
        id: build
        if: steps.eas.outputs.configured == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          if [ -n "$BUILD_ID" ]; then
            if ! [[ "$BUILD_ID" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "::error::build_id must be an EAS build id, not '$BUILD_ID'."
              exit 1
            fi
            pnpm dlx eas-cli@latest build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build.json"
          else
            pnpm dlx eas-cli@latest build --platform android --profile github \
              --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          fi
          node -e '
            const parsed = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const build = Array.isArray(parsed) ? parsed[0] : parsed;
            const url = build?.artifacts?.buildUrl;
            if (build?.platform !== "ANDROID" || build?.buildProfile !== "github") {
              console.error(`::error::EAS build ${build?.id} is ${build?.platform} ${build?.buildProfile}, not an Android build of the github profile.`);
              process.exit(1);
            }
            if (build?.status !== "FINISHED" || !url) {
              console.error(`::error::The EAS build did not finish with an APK (status ${build?.status}).`);
              process.exit(1);
            }
            const out = [`url=${url}`, `version=${build.appVersion}`, `code=${build.appBuildVersion}`, `id=${build.id}`];
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          ' "$RUNNER_TEMP/build.json"

      - name: Download the APK and its checksum
        if: steps.eas.outputs.configured == 'true'
        env:
          URL: ${{ steps.build.outputs.url }}
          VERSION: ${{ steps.build.outputs.version }}
          CODE: ${{ steps.build.outputs.code }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          curl --fail --silent --show-error --location --retry 3 "$URL" -o "ideanest-$VERSION-$CODE.apk"
          sha256sum "ideanest-$VERSION-$CODE.apk" > "ideanest-$VERSION-$CODE.apk.sha256"

      - name: Publish the release
        if: steps.eas.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          CODE: ${{ steps.build.outputs.code }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          tag="android-v$VERSION-$CODE"
          {
            echo "IdeyaNest for Android $VERSION (build $CODE), from $GITHUB_SHA."
            echo
            echo "**Install:** download \`ideanest-$VERSION-$CODE.apk\` on the phone and open it. Android asks once to allow installs from the browser or file manager. A newer APK installs over this one."
            echo
            echo "**Updates:** JavaScript changes arrive over the air and the app offers a restart when one is ready. A change to native code needs a new APK from this page."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/release/ideanest-$VERSION-$CODE.apk.sha256")\` · EAS build \`$BUILD_ID\`"
          } > "$RUNNER_TEMP/notes.md"
          # What changed since the previous APK; the first one lists nothing rather than every pull request ever.
          previous=$(git tag --list 'android-v*' --sort=-creatordate | head -n 1)
          generated=()
          if [ -n "$previous" ]; then generated=(--generate-notes --notes-start-tag "$previous"); fi
          gh release create "$tag" "$RUNNER_TEMP"/release/* \
            --target "$GITHUB_SHA" \
            --title "IdeyaNest for Android $VERSION ($CODE)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${generated[@]}"
