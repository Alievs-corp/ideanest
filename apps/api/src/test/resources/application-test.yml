# Integration tests run against configuration that matches a deployed
# environment, not the developer's. A health endpoint that hides component
# detail in production and shows it locally must be asserted against the
# production shape, or the assertion proves nothing.
spring:
  docker:
    compose:
      # Tests bring their own database. Starting the local stack underneath them
      # would race with it and leave a container running afterwards.
      enabled: false
  datasource:
    # Placeholders. Testcontainers replaces all three before the context starts;
    # they exist so that resolving application.yml does not fail on a missing
    # environment variable if a test ever runs without a container.
    url: jdbc:postgresql://localhost:1/replaced-by-testcontainers
    username: replaced-by-testcontainers
    password: replaced-by-testcontainers

  mail:
    # Neither the host nor the port is here: AbstractIntegrationTest points both
    # at GreenMail, which binds to the loopback address on whichever port is
    # free. They are registered there rather than on the classes that assert on
    # mail because a second property source means a second context and a second
    # PostgreSQL container -- the same reason the identity provider stub's
    # address is registered there.
    #
    # These are the fallback for anything running outside that base class, and
    # port 1 is reserved and unlistened-on deliberately: such a test must fail to
    # connect rather than quietly reach whatever is on the developer's 1025.
    host: 127.0.0.1
    port: 1
    properties:
      mail:
        smtp:
          # Short, because a test should not spend a production connect timeout
          # discovering an expected failure -- but not as short as it could be.
          # Under 500ms this was long enough on a quiet machine and not on a
          # loaded CI runner, which is the shape of a test that fails once a
          # fortnight.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

ideanest:
  # A scrape credential, so that the suite exercises the whole of #138: the endpoint
  # is exposed, MetricsScrapeSecurity exists, and HealthEndpointTests asserts both
  # that an anonymous caller is refused and that this credential is accepted.
  #
  # In the shared profile rather than on one test class, for AbstractIntegrationTest's
  # reason: a class with a property source of its own gets a context of its own and a
  # second PostgreSQL container with it.
  metrics:
    scrape:
      username: prometheus
      password: scrape-me

  abuse:
    # The suite shares one process, one limiter, and one client address: every
    # request in it comes from 127.0.0.1. A realistic per-address budget would
    # therefore make the discovery suites fail each other rather than fail
    # themselves, so it is effectively off here -- exactly as the sign-in limits
    # below are, and for the same reason. The boundary itself is asserted by
    # SearchRateLimitTests, which drives the endpoints with a limiter of its own.
    searches-per-address: 100000
    suggestions-per-address: 100000

  analytics:
    aggregation:
      # Disabled, exactly as every other schedule here is: `-` is Spring's own
      # value for "do not schedule this". The suite drives AnalyticsRollupService
      # directly, which is deterministic; a pass firing hourly in the background
      # would recompute the very rows a test is about to assert on -- and it would
      # do so against the real clock while the suite is moving AdjustableClock
      # across a midnight boundary.
      schedule: "-"
      # The production zone, deliberately. The timezone decision is what
      # AnalyticsRollupTests checks, and asserting a midnight boundary against a
      # zone nothing is deployed in would prove the arithmetic and nothing about
      # the answer a creator gets. UTC+4 is also what makes those tests mean
      # something: under UTC they would pass without exercising anything.
      zone: Asia/Baku
      # The production window. Late arrival is a rule this suite asserts, and a
      # shortened window here would assert a different one.
      re-rollup-window: PT72H

  signature:
    provider:
      # The suite runs the real SİMA adapter against a WireMock stub, which is how the
      # whole of #429 is exercised while #423 keeps production SİMA switched off. A
      # deployed environment leaves this empty and signs nothing -- see application.yml.
      #
      # Deliberately not a test double implementing SignatureProvider:
      # SignatureProviderBoundaryTests exists to keep that interface singular, and a
      # second implementation in the test source tree would make the rule it checks
      # weaker than it reads.
      primary: SIMA_IMZA
    sima:
      # SANDBOX, which is what SignatureProviders refuses to start without. The base URL
      # is registered by AbstractIntegrationTest because the stub takes whichever port is
      # free; the credentials are present because the adapter refuses to start with a
      # missing one, and they reach nothing but the stub.
      environment: SANDBOX
      client-id: ideanest-test
      client-secret: not-a-secret
      session-life: PT5M
      request-timeout: PT5S

  legal:
    signature:
      # ON, so #429's rule is exercised. A deployed environment runs with this false
      # until #424 answers, and LegalProperties argues at length why the default is not
      # "everybody signs".
      enabled: true
      # Above five thousand. A number chosen to be a number -- it is NOT #424's answer
      # and nothing may read it as one. Its only job is to put campaigns on both sides of
      # a line so that both sides are tested.
      goal-ceiling: 5000.00
      required-for-legal-entity: true

  staff:
    # One address, so the fail-closed default is exercised by every other
    # account in the suite: any account that is not this one is refused, which
    # is the assertion that matters. The moderator fixture registers exactly
    # this address, and holds ADMINISTRATOR through the bootstrap -- so the
    # suites written before #295 keep passing unchanged, and the ones that
    # assert a narrower capability grant a role explicitly.
    bootstrap-emails: moderator@ideanest.test

  obligation:
    # Disabled, exactly as every other schedule here is: `-` is Spring's own value for
    # "do not schedule this". ObligationSweepTests drives the pass directly with the
    # instant to judge against; a daily sweep firing in the background would escalate
    # the very campaigns a test is about to assert are still current.
    schedule: "-"
    # The production values. The interval and the lead are what the tests are checking,
    # so shortening them here would mean asserting a rule against a configuration
    # nothing runs on -- and there is no need, because the suite moves AdjustableClock.
    interval: P30D
    reminder-lead: P7D
    per-pass: 50

  payout:
    # `-`, like every other job's schedule in this profile; PayoutDestinationReminderTests drives it.
    destination-reminder-schedule: "-"

  project:
    withdrawal:
      # `-`, like every other job's schedule in this profile; AutomaticWithdrawalTests drives it.
      automatic-schedule: "-"

    story:
      # The production value. The window itself is what the tests are checking, so
      # shortening it here would mean asserting a rule against a configuration
      # nothing runs on — and there is no need: the suite moves the application's
      # Clock (AdjustableClock) rather than waiting, which is both deterministic
      # and instant.
      version-interval: 5m
      # Deliberately small. The retention rule is only observable once more
      # versions exist than are kept, and reaching fifty would mean fifty
      # documents written five minutes of simulated time apart for one assertion.
      # Three exercises exactly the same arithmetic.
      versions-kept: 3

    reminders:
      # Disabled, exactly as the anonymisation schedule is: `-` is Spring's own
      # value for "do not schedule this". The suite drives LaunchReminderJob
      # directly, which is deterministic; a sweep firing every minute in the
      # background of a test run would claim the very rows a test is about to
      # assert on.
      send-schedule: "-"
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1 — a realistic per-client limit would make the tests fail each
      # other rather than fail themselves. The per-address limit is left at a
      # value a test can actually reach, because each test uses its own address
      # and the limit is therefore exercised in isolation.
      signups-per-client: 100000
      signups-per-address: 3
      # Small enough that the sweep's batching is exercised rather than described:
      # a campaign with four followers takes two passes.
      send-batch-size: 3
      # Disabled for the reason above, and with one of its own: DeadlineReminderJob
      # acts on every LIVE campaign inside its last two days, and the suite creates
      # campaigns with short deadlines all over the place. A sweep firing in the
      # background would announce them and fill `notifications` under tests that
      # have nothing to do with deadlines.
      deadline-schedule: "-"

    launches:
      # Disabled, exactly as every other schedule here is: `-` is Spring's own value
      # for "do not schedule this". CampaignLaunchTests drives the job directly with
      # the instant to judge against; a sweep firing every minute in the background
      # would open the very campaigns a test is about to assert are still closed.
      schedule: "-"
      # Small enough that the batching is exercised rather than described: three
      # campaigns due at once take two passes.
      batch-size: 2

    finalisation:
      # Disabled, for the reason every schedule in this file is, and with one of its
      # own: the suite moves AdjustableClock past campaign deadlines deliberately, so
      # a sweep firing in the background would close the very campaigns a test is
      # about to close itself — and would do it before the test could assert that
      # they were still live.
      schedule: "-"
      # Deliberately small, so that the bound on a pass is observable at all: three
      # closed campaigns take two passes, which is what proves the sweep is bounded
      # rather than merely documented as bounded.
      batch-size: 2

  pledge-manager:
    surveys:
      # Disabled, for the reason every schedule in this file is: the suite drives
      # SurveyNudgeJob directly with the instant it wants to test. A daily sweep
      # firing in the background would chase the non-responders of a survey a test
      # is in the middle of asserting has had no reminders.
      nudge-schedule: "-"
      # Small enough that the audience ceiling is exercised rather than described:
      # a campaign with three backers is truncated at two, which is what proves the
      # frozen count is honest rather than merely documented as being.
      max-recipients: 2
    addresses:
      # A key that exists only here, so that §17.2's encryption is exercised by the
      # suite rather than skipped by it. Thirty-two bytes of base64, and deliberately
      # not a value anything would mistake for a real one -- a plausible-looking test
      # key is one somebody eventually copies into an environment file.
      primary-key-id: test
      keys:
        test: "dGVzdC1vbmx5LWFkZHJlc3Mta2V5LTMyLWJ5dGVzISE="

  verification:
    # ON, and this profile is the only place it is. #431 gates a payout on an approved
    # identity verification and #424 has not set the threshold that turns it on in a
    # deployed environment -- so production runs with it false and the suite runs with
    # it true, which is the only way the gate is exercised at all.
    #
    # #431 says what that costs and how to pay it: "Any suite that reaches payout now
    # needs a verified creator -- extend the fixture helper rather than each suite."
    # The helper is `support/Verifications`.
    required: true
    documents:
      # A key that exists only here, so that #105's encryption is exercised by the
      # suite rather than skipped by it -- an unconfigured deployment refuses a
      # submission with a 503, which would make every test in
      # IdentityVerificationTests assert the refusal instead of the feature.
      #
      # Thirty-two bytes of base64, and deliberately not a value anything would
      # mistake for a real one. The same argument the address key above makes.
      primary-key-id: test
      keys:
        test: "dGVzdC1vbmx5LWRvY3VtZW50LWtleS0zMi1ieXRlcyE="

  fx:
    # ON in the suite, and the source is a test double rather than cbar.az. A
    # suite that reached a public website would fail for reasons that are not
    # ours, on somebody else's schedule -- `ScriptedRateSource` is registered by
    # `TestDoublesConfiguration` and is what the fx tests script.
    enabled: true
    # Never fetched, because the source is replaced. Present because
    # FxProperties refuses a URL with no {date} in it, and a suite that skipped
    # the check would not be running the configuration a deployment runs.
    source-url: https://rates.test.invalid/{date}.xml
    # `-`, like every other job's schedule in this profile. A refresh firing in
    # the background would write rows a test is about to assert are absent.
    refresh-schedule: "-"

  payment:
    provider:
      # The suite registers its own PaymentProvider bean and names it here, which is
      # how the whole of #61, #64, #65 and #66 is exercised while #60 remains
      # unanswered. A deployed environment leaves this empty and collects nothing --
      # see application.yml.
      primary: PAYRIFF
    reconciliation:
      # `-`, like every other job's schedule in this profile. A pass firing in the
      # background reads the very ledger rows a payment test is in the middle of
      # writing, and would report an imbalance that is a half-finished fixture.
      # The tests drive LedgerReconciliationJob directly.
      schedule: "-"
    collection:
      # Both `-`, like every other job's schedule in this profile. A timer firing in
      # the background of a test suite would charge the very pledges a test is about
      # to charge itself, and the assertion that failed would be about somebody's
      # card. The tests drive the two jobs directly with the instant they want.
      schedule: "-"
      retry-schedule: "-"
      # Small, so that a test can prove the bound is applied without creating a
      # hundred pledges to prove it with.
      campaigns-per-pass: 2
      charges-per-pass: 3
      drops-per-pass: 2
      retry-window: P7D
      attempt-delays:
        - PT0S
        - PT24H
        - PT72H
        - P5D
      unresolved-recheck: PT1H
      statement-descriptor: IdeaNest
    circuit-breaker:
      # Two rather than five, so that a test can open the breaker with two failures
      # instead of five. The cooldown stays a minute: AdjustableClock is what moves
      # past it, so a shorter one would only make the test's intent less obvious.
      failure-threshold: 2
      cooldown: PT1M
    webhooks:
      tolerance: PT5M
    refunds:
      # `-`, like every other job's schedule in this profile; CampaignRefundTests drives it.
      schedule: "-"

  pledge:
    reservation:
      # Disabled, exactly as the two schedules below are: `-` is Spring's own value
      # for "do not schedule this". The suite drives ReservationCleanerJob directly
      # with the instant it wants to test. A sweep firing every minute in the
      # background would release the very reservations a concurrency test is in the
      # middle of counting — and it would do it once a fortnight, on CI, in the run
      # nobody is watching.
      cleanup-schedule: "-"
      # The production value. The window is what the tests are checking, so
      # shortening it here would mean asserting the rule against a configuration
      # nothing runs on. There is no need either: the suite moves the application's
      # Clock (AdjustableClock) rather than waiting five minutes.
      ttl: 5m
      # Deliberately small. The bound is only observable once more reservations
      # have lapsed than one pass will take, and reaching two hundred would mean
      # two hundred checkouts for one assertion. Two exercises the same arithmetic.
      cleanup-batch-size: 2
    rate-limit:
      # The production values. The limit is per account and every test uses its
      # own backer, so it is exercised in isolation rather than by the tests
      # failing each other -- which is why this one does not need the ceiling
      # that the per-address auth limits below are given.
      pledges-per-user: 10
      window: PT1M

  idempotency:
    # Disabled, exactly as the two schedules below are: `-` is Spring's own value
    # for "do not schedule this". The suite drives IdempotencyKeySweeper directly
    # with the instant it wants to test, which is deterministic; a timer firing in
    # the background would delete the very keys a replay test is about to retry.
    sweep-schedule: "-"
    # The production value, §17.2's. The retention is what the sweep test is
    # about, so shortening it here would mean asserting the rule against a
    # configuration nothing runs on -- and there is no need, because the suite
    # moves the application's Clock rather than waiting a day.
    retention: PT24H
    # Deliberately small, like the reservation batch above and for the same
    # reason: the bound is only observable once more keys have expired than one
    # pass will take.
    sweep-batch-size: 2

  outbox:
    # Disabled, exactly as the schedules above are: `-` is Spring's own value for "do
    # not schedule this". The suite drives OutboxRelay and OutboxDispatch directly
    # with the instant it wants to test, which is deterministic. This one would
    # otherwise fire every second, publishing the very rows a test is in the middle
    # of asserting are still pending -- and it would claim them on another thread,
    # which is the hardest kind of flake to reproduce.
    poll-schedule: "-"
    # The production values. The retry policy is what the exhaustion test is about,
    # so shortening it here would mean asserting the rule against a configuration
    # nothing runs on -- and there is no need, because the tests hand the dispatch
    # the instant to judge rather than waiting for a backoff to elapse.
    batch-size: 100
    retry-backoff: PT5S
    max-backoff: PT10M
    max-attempts: 8

  notification:
    delivery:
      # Disabled, exactly as the outbox relay above is and for the identical reason:
      # this one would otherwise fire every second and send the very rows a test is
      # in the middle of asserting are still PENDING, on another thread. The suite
      # drives NotificationSender and NotificationDispatch directly with the instant
      # it wants to judge against.
      send-schedule: "-"
      # Deliberately small, so that the bound on a pass is observable at all. With
      # the production hundred, a test proving that a backlog is not drained in one
      # pass would have to write a hundred and one notifications to see it.
      batch-size: 2
      # The production retry policy, because the retry and dead-letter tests are
      # about that policy: shortening it here would assert the rule against a
      # configuration nothing runs on. There is no need, because the tests hand the
      # dispatch the instant to judge rather than waiting for a backoff to elapse.
      retry-backoff: PT5S
      max-backoff: PT10M
      max-attempts: 8
    digest:
      # Disabled, exactly as the delivery schedule above is and for the identical
      # reason: this one would otherwise fire on the hour and combine the very rows
      # a test is in the middle of asserting are still HELD, on another thread. The
      # suite drives NotificationDigestJob and DigestAssembly directly with the
      # instant it wants to judge the digest period against.
      schedule: "-"
      # UTC here rather than the production Asia/Baku, so that a test computing an
      # expected digest boundary does it in the zone its own instants are in. What
      # the zone is for is argued in DigestWindow; that argument is about a real
      # deployment sending mail to a real person, and a suite has neither.
      zone: "UTC"
      at-hour: 8
      # Deliberately small, so that the bound on a pass is observable at all —
      # the same reason the delivery batch size above is two.
      batch-size: 2
      # Small for the same reason: a test proving that a digest is bounded and that
      # the remainder stays held and due would otherwise need two hundred and one
      # notifications to see it.
      max-notifications-per-message: 3

  # The bound on a computed audience. Moved out of `ideanest.notification` by #98,
  # which added a second caller: a message reports how many backers it reached, and
  # two independently configured ceilings would be a response that disagrees with the
  # delivery.
  audience:
    # Deliberately tiny, so that the bound on a computed audience is observable at
    # all. The production five thousand is above every campaign the platform has,
    # which is the point of it and would also mean a test proving the bound exists
    # had to insert five thousand and one pledges.
    max-recipients: 3

  realtime:
    # Disabled, exactly as every schedule in this file is: `-` is Spring's own value
    # for "do not schedule this". A flush firing every second in the background of a
    # suite would push the very window a test is about to assert on.
    #
    # The module itself stays ON -- `enabled: false` would stop the accumulation as
    # well, and a suite asserting on a buffer nothing ever filled asserts nothing.
    # RealtimeWindowTests drives RealtimeFlusher#flush directly.
    flush-schedule: "-"

  user:
    # Disabled. `-` is Spring's own value for "do not schedule this". The suite
    # drives AccountAnonymisationJob directly with the instant it wants to test,
    # which is both deterministic and instant; a timer firing in the background
    # of a test run is a source of failures that reproduce once a fortnight.
    anonymisation-schedule: "-"
    rate-limit:
      # Each test uses its own account, so these are exercised in isolation and
      # the real values would only make tests fail each other. Left low enough
      # that the limit itself can still be asserted.
      exports-per-account: 5
      deletion-attempts-per-account: 5

  auth:
    rate-limit:
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1. A realistic per-address limit would therefore make the tests
      # fail each other rather than fail themselves, so the per-address ceiling
      # is effectively off here and the per-email one is left at its real value:
      # each test uses its own address, so the limit is exercised in isolation.
      # The per-address path is covered by InMemoryRateLimiterTests instead.
      registrations-per-address: 100000
      verifications-per-address: 100000
      registrations-per-email: 3
      sign-ins-per-address: 100000
      sign-ins-per-email: 5
      social-sign-ins-per-address: 100000
      # §4.1's A-06, on the same principle: the per-address ceiling is off because
      # every test calls from 127.0.0.1, and the per-email one keeps its real value
      # because each test uses its own address.
      password-resets-per-address: 100000
      password-resets-per-email: 3
      # §4.1's A-12 and A-13. Per account, so each test exercises it in isolation
      # and the real value can stand.
      credential-changes-per-user: 10
    token:
      issuer: https://api.ideanest.test
    oauth:
      # The issuers and the key set addresses stay as they are in
      # application.yml -- the real Google and Apple issuer strings, so the
      # issuer check is exercised against the value production uses. Only the
      # jwks-uri is replaced, by AbstractIntegrationTest, because the stub takes
      # whichever port is free.
      providers:
        google:
          audiences: ideanest-test.apps.googleusercontent.com
        apple:
          audiences: az.ideanest.test
    refresh-cookie:
      # TestRestTemplate speaks plain HTTP, and a Secure cookie would never come
      # back — the cookie tests would then pass for the wrong reason.
      secure: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never
