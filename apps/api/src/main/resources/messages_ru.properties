# ---------------------------------------------------------------------------
# Письма аутентификации -- вторая половина #86, и это не уведомления
# ---------------------------------------------------------------------------
#
# Ни одно из них не является NotificationType: строка в `notifications` не
# пишется, и никакая настройка их не отключает. Поэтому MimeTransactionalMailer
# отправляет их без строки о настройках выше.
#
# {0} есть только в EMAIL_CHANGE_NOTICE -- это адрес, на который переезжает аккаунт.

