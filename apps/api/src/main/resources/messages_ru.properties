email.auth.EMAIL_CHANGE_CONFIRMATION.body2=Если срок действия ссылки истёк, запросите новую в настройках аккаунта. Если вы этого не просили, не отвечайте на письмо, и аккаунт останется на прежнем адресе.
email.auth.EMAIL_CHANGE_CONFIRMATION.action=Подтвердить этот адрес

email.auth.EMAIL_CHANGE_NOTICE.subject=Ваш аккаунт переносится на другой адрес
email.auth.EMAIL_CHANGE_NOTICE.headline=Ваш аккаунт переносится
email.auth.EMAIL_CHANGE_NOTICE.body=Поступил запрос перенести ваш аккаунт на IdeaNest с этого адреса на {0}. После подтверждения того адреса войти с этого будет нельзя.
email.auth.EMAIL_CHANGE_NOTICE.body2=Если это были вы, делать ничего не нужно. Если нет, задайте новый пароль с этого адреса сейчас, пока он всё ещё указан в аккаунте.
