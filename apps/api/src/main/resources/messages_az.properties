email.auth.EMAIL_CHANGE_NOTICE.headline=Hesabınız köçürülür
email.auth.EMAIL_CHANGE_NOTICE.body=IdeaNest hesabınızın bu ünvandan {0} ünvanına köçürülməsi tələb olundu. Həmin ünvan təsdiqləndikdən sonra bu ünvanla girişiniz mümkün olmayacaq.
email.auth.EMAIL_CHANGE_NOTICE.body2=Bunu siz etmisinizsə, görüləsi iş yoxdur. Siz etməmisinizsə, hesabda hələ də bu ünvan qeydə alınıbkən indi bu ünvandan yeni şifrə təyin edin.
