# ---------------------------------------------------------------------------
# The auth messages -- #86's other half, and not notifications
# ---------------------------------------------------------------------------
#
# What AuthEmailComposer sends. None of these is a NotificationType: nothing
# writes a `notifications` row for them, no preference governs them, and none of
# them may be switched off -- an account whose owner had turned off "your
# password was changed" is a takeover nobody is told about. That is why
# MimeTransactionalMailer renders them without the preferences line above.
#
# There is no {0} in most of them, because the copy addresses nobody by name;
# AuthEmailComposer says why it does not go and find one. EMAIL_CHANGE_NOTICE is
# the exception and its {0} is the address the account is moving to.
#
# Nothing here states how long a link lasts. The TTLs are AuthProperties', the
# reset link's is one hour and the verification link's is twenty-four, and one
# sentence that reads correctly at both needs three plural forms in Russian.

