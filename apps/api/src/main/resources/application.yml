spring:
  application:
    name: ideanest-api
  profiles:
    default: local
  mvc:
    problemdetails:
      # RFC 9457 responses for framework-raised errors, so the shape of an error
      # does not depend on where it was raised.
      enabled: true
  jackson:
    default-property-inclusion: non_null

  http:
    clients:
      imperative:
        # THE TRANSPORT IS A PLATFORM DECISION, NOT A CLASSPATH ACCIDENT -- issue #396.
        #
        # Left unset, Spring picks a `ClientHttpRequestFactory` by looking for one on
        # the classpath, and it prefers Apache HttpClient to the JDK's. Nothing here
        # asked for Apache HttpClient: it arrived transitively when the AWS SDK bom
        # went to 2.54, because `awssdk:s3` now ships `apache5-client`. Every outbound
        # call this service makes -- the Central Bank rates, Expo push, the cache
        # invalidator -- silently changed connection pool, timeouts, and, worst,
        # gained automatic retries on requests that are not all idempotent.
        #
        # `jdk` is what this service was written against and tested on, and it is the
        # client that does exactly what it is asked: one request, one response, no
        # retry and no `Retry-After` sleep. A caller that wants a retry states it
        # (`RetryTemplate` in the jobs layer does).
        #
        # It is set here rather than in the test profile because the harness must run
        # the transport the application runs -- see HttpClientTransportTests, which
        # asserts this rather than trusting it, and RegistrationApiTests, whose
        # assertion on a 429 an auto-retrying client turned into a fourteen-minute
        # sleep on the rate-limit window.
        factory: jdk

  messages:
    # NEVER THE SERVER'S OWN LANGUAGE -- issue #324.
    #
    # Spring's default is to fall back to the JVM's locale when a bundle for the
    # requested one is missing, and English is deliberately missing: it lives in
    # messages.properties itself rather than in messages_en.properties, so that a
    # key absent from every translation still resolves. With the default left on, a
    # request for English on a host whose locale is tr would resolve
    # messages_en (absent) -> messages_tr (present) and send a Turkish email to an
    # English reader -- a bug whose reproduction depends on the machine.
    #
    # Off, the chain is messages_<language> -> messages, which is English, and the
    # answer no longer depends on where the process is running.
    fallback-to-system-locale: false

  datasource:
    # No defaults. A missing database URL should stop the process with a clear
    # message, not silently connect somewhere plausible. Local values are in
    # application-local.yml; tests get theirs from Testcontainers.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ideanest-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      # Fail fast. A request queued for thirty seconds behind an exhausted pool
      # has already lost the user; holding the thread only spreads the outage.
      connection-timeout: 3000
      # Below the typical infrastructure idle timeout, so the pool retires a
      # connection before something between us and PostgreSQL does it silently.
      max-lifetime: 1200000

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate checks that the mapping matches it and
      # refuses to start when it does not. It must never be permitted to alter a
      # table: a schema that drifts per environment is unreproducible, and
      # `update` has been known to drop data it did not recognise.
      ddl-auto: validate
    # Off. With it on, a lazy association can be loaded from a template or a
    # serialiser, long after the service layer thought it was finished, which
    # hides N+1 queries and holds a connection for the whole request.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Applied at start-up in every environment, so an instance never serves
    # traffic against a schema it was not built for.
    validate-on-migrate: true
    out-of-order: false
    # A migration that arrived after this one did must not be skipped over.
    baseline-on-migrate: false
    # `clean` drops every object in the schema. There is no environment in which
    # we want that available, and production is one command line flag away from
    # any other environment.
    clean-disabled: true

  # #86's transport. The defaults point at the Mailpit container in
  # `compose.yaml`, which accepts everything and delivers nothing; every
  # deployed environment overrides host, port and credentials.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # Deliberately not `test-connection: true`. A mail relay that is briefly
    # unreachable would then stop the service from starting, and the queue this
    # transport drains is durable precisely so that it does not have to be up.
    test-connection: false
    properties:
      mail:
        smtp:
          # STARTTLS is required rather than merely enabled, so that a
          # misconfigured relay fails instead of falling back to sending
          # somebody's address in the clear. Both are off locally because
          # Mailpit speaks plain SMTP.
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
          auth: ${MAIL_AUTH:false}
          # Bounded, and short. This runs inside the transaction that claims a
          # notification row, so a relay that accepts the connection and then
          # stops talking would otherwise hold that row's lock for as long as the
          # socket stayed open.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:8080}
  # In-flight requests finish before the process exits. During a rolling deploy
  # the alternative is a truncated response to a real user.
  shutdown: graceful
  error:
    # An error page is not a debugging channel. Detail belongs in the logs.
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        # Only what the platform needs. Every other endpoint stays closed until
        # there is a reason and an access control story for it.
        #
        # `prometheus` has both -- §18's reason and #138's access control story:
        # MetricsScrapeSecurity puts HTTP Basic in front of it and exists only when
        # ideanest.metrics.scrape.password is configured. Exposing the endpoint here
        # and guarding it there is the arrangement that fails safe: without the
        # credential the chain is absent, the endpoint answers 401 from the API's own
        # deny-by-default chain, and nothing is published to a stranger.
        include: health,prometheus
  endpoint:
    health:
      # Kubernetes reads /actuator/health/liveness and /readiness separately: a
      # service that is alive but not ready must not be restarted, only removed
      # from the load balancer.
      probes:
        enabled: true
      show-details: never
      show-components: never

  # Every series this service publishes carries the application's name, so one
  # scrape target holding two services is still two sets of graphs.
  metrics:
    tags:
      application: ${spring.application.name}

  # §18's distributed tracing, OFF UNLESS A COLLECTOR IS CONFIGURED. The exporter
  # would otherwise post spans to localhost:4318 every few seconds and log a
  # connection failure each time, which is a deployment that looks broken because
  # of a feature nobody asked for.
  #
  # CorrelationFilter already accepts and mints W3C `traceparent`, so a request that
  # arrives with one keeps its trace identifier in the logs whether or not spans are
  # being exported. Turning this on adds the spans; it does not add the correlation.
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      # Five per cent. Enough to see the shape of a slow endpoint, few enough that a
      # collector is not a second capacity problem. An incident raises it; a steady
      # state does not need it.
      probability: ${TRACING_SAMPLE_RATE:0.05}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# §10.1's OpenAPI 3.1 document (#136). OpenApiConfiguration holds everything a
# scanner cannot infer; what is here is how the document itself is served.
springdoc:
  api-docs:
    # The conventional path, kept rather than moved: every generator, every
    # linter and every reader looks here first, and a relocated document is one
    # more thing a client's build has to be told.
    path: /v3/api-docs
  # Swagger UI is not on the classpath -- the `-api` starter has no assets --
  # and this says so rather than leaving it to the absence of a dependency.
  # A future release that adds the UI starter for local use then has to turn it
  # on deliberately instead of exposing it by having depended on something.
  swagger-ui:
    enabled: false
  # Every handler here answers JSON and every body it accepts is JSON, and none of
  # them says so with `produces`/`consumes` because there has never been a second
  # representation to choose between. Without these the document describes every
  # response as `*/*`, which a generator turns into a client keyed on a wildcard
  # media type -- correct, unreadable, and the first thing anybody writing against
  # the contract would ask about.
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  writer-with-order-by-keys: true
  # Alphabetical, both of them. The document is a committed file compared byte
  # for byte by OpenApiContractTests, so any ordering the scanner decides by
  # classpath order or reflection would produce a diff on every unrelated change
  # and eventually be ignored.
  writer-with-default-pretty-printer: true

ideanest:
  # §18's metrics endpoint -- issue #138. Both halves come from the deployment and
  # there is no default password: MetricsScrapeSecurity exists only when one is set,
  # so a deployment that configures nothing gets no metrics endpoint rather than an
  # unauthenticated one.
  #
  # Metrics are not confidential the way a pledge is, and they are a map: queue
  # depths, provider availability, JVM internals, and every URI template this service
  # serves. Read continuously by a stranger that is reconnaissance, and a
  # rate-limit-free way to measure when the platform is under strain.
  metrics:
    scrape:
      username: ${METRICS_SCRAPE_USER:prometheus}
      password: ${METRICS_SCRAPE_PASSWORD:}

  # §4.13's caching, from the service's side -- issue #127. The web client caches its
  # public reads for a minute; this is how it is told which campaign stopped being
  # true before the minute is up. See az.ideanest.shared.cache.
  #
  # A DEPLOYMENT THAT SETS NEITHER OF THESE DOES NOTHING AND IS CORRECT. Every cached
  # read on the far side already carries its own window, so invalidation shortens a
  # staleness that was always bounded -- it does not create correctness that would
  # otherwise be missing. Both halves are required together: an endpoint with no secret
  # is a call the far side answers 401 to, every time, in a log line per event.
  cache:
    invalidation:
      # The full URL of the web client's endpoint, e.g.
      # https://ideanest.az/api/cache/revalidate
      endpoint: ${CACHE_REVALIDATE_URL:}
      # The shared secret, sent as a bearer token, and the same value the web client
      # reads from IDEANEST_REVALIDATE_SECRET. It is not protecting confidential data --
      # the tags name public pages -- it is protecting the cache: an endpoint that
      # evicts by name and asks for no proof is a request anybody can send in a loop to
      # turn every cached render into an origin fetch.
      secret: ${CACHE_REVALIDATE_SECRET:}
      # Short, because the call is made from a pool the outbox relay feeds. Long enough
      # to cross a datacentre and not long enough to matter if the far side is wedged.
      connect-timeout: PT2S
      read-timeout: PT3S
      # How many batches may wait before new ones are dropped. A backlog means the far
      # side is unreachable, and a hint that arrives ten minutes late has already been
      # overtaken by the window it was meant to shorten.
      queue-capacity: 256

  # §13.1's image ingestion -- the media pipeline design of 2026-08-30.
  #
  # A DEPLOYMENT THAT SETS NONE OF THIS STARTS, SERVES EVERY OTHER ENDPOINT, AND
  # ANSWERS AN UPLOAD WITH 503. There is no default bucket, because a default would
  # be a guess about somebody else's infrastructure and a service that quietly wrote
  # a creator's photograph to a plausible-looking address would be worse than one
  # that did nothing. Refusing to start would trade a hundred working endpoints for
  # one -- the same position VerificationProperties takes about its keys.
  media:
    storage:
      # S3-compatible. R2, MinIO and S3 itself all speak it, and which of them is a
      # deployment's decision: this repository rolls out a digest through a hook and
      # owns no infrastructure to decide on.
      #
      # Absent for AWS itself, where the region decides the address.
      endpoint: ${MEDIA_S3_ENDPOINT:}
      region: ${MEDIA_S3_REGION:auto}
      bucket: ${MEDIA_S3_BUCKET:}
      # Both absent falls back to the SDK's default chain -- an instance role, or a
      # mounted web identity token. That is the arrangement to prefer: a credential
      # nobody had to paste into a variable is one nobody can leak from one.
      access-key-id: ${MEDIA_S3_ACCESS_KEY_ID:}
      secret-access-key: ${MEDIA_S3_SECRET_ACCESS_KEY:}
      # WHAT A BROWSER FETCHES, which is routinely not `endpoint` -- a CDN in front
      # of a bucket. Conflating the two is how a private address ends up rendered
      # into a page, so they are two settings and both are required.
      public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
      # MinIO needs it; most hosted services do not.
      path-style: ${MEDIA_S3_PATH_STYLE:false}

    # §13.1's "20MB images". A denial-of-service control and not a rule about what
    # makes a good cover: nobody is blocked from making a campaign by it, and
    # without it one request can occupy a processing slot with an arbitrarily large
    # file.
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:20971520}
    # The presigned address is a credential -- anybody holding it may write that one
    # object until it expires -- so it is short.
    upload-window: PT10M
    # §13.1's `hero`, and the same 1440 next.config.mjs stops its deviceSizes at.
    # The widest box in the product is 720 CSS px, so this is that box at 2x and
    # anything beyond it encodes pixels nobody can resolve.
    longest-edge: 1440
    jpeg-quality: 82

    processing:
      # Every five seconds, and it is the one schedule in this file that is not a
      # sweep over rows that can wait: the person on the other end is watching a
      # spinner. The lease still means one replica does the work.
      schedule: ${MEDIA_PROCESSING_SCHEDULE:*/5 * * * * *}
      # Bounded so a backlog does not become one pass that overlaps its own next
      # tick. Small because each item spawns a process -- though not for memory:
      # libvips streams, so no bitmap is ever in this heap.
      batch-size: 4
      # A PENDING row is somebody who closed the tab.
      abandoned-after: PT6H

  # §17.3's limits on the public reads. Everything else in that table guards a
  # module's own endpoint and is configured beside it; these guard endpoints that
  # take no token at all, so they are counted per client address -- an office or a
  # mobile carrier behind one NAT shares a budget, which is the cost of limiting a
  # caller who has not told us who they are.
  #
  # The counter is per replica (InMemoryRateLimiter), so the real ceiling is these
  # numbers multiplied by the number of instances. Shared storage is #134.
  abuse:
    # §17.3: "search 60/min". Spent by GET /v1/discover, its facets, and
    # GET /v1/search together, because all three run the same query against the
    # same tables -- two budgets would give a script alternating between them twice
    # the allowance for exactly the work being bounded.
    searches-per-address: 60
    # Autocomplete, and deliberately not the same number. A suggestion is one
    # request per keystroke, so a reader typing a ten-letter query spends ten of
    # them; sixty a minute would refuse the sixth thing they searched for. It is
    # also the cheapest query here -- a prefix match, cached for five minutes -- so
    # what bounds it is not what bounds a faceted feed scan.
    suggestions-per-address: 300
    window: PT1M

  analytics:
    # §4.7's referral rule is defaulted in code and stays there -- see
    # AnalyticsProperties for why a deployment that configures none of it has to
    # start. Only the rollup appears here, because §8.4 is a table of sixteen
    # schedules and an operator asking "when does the aggregator run" reads them
    # in one place.
    aggregation:
      # §8.4's `analytics-aggregator`, hourly. Hourly for a daily table is not a
      # contradiction: the day being aggregated is the one in progress, so an
      # hourly pass puts today's figure on the dashboard within an hour of the
      # truth instead of a day behind it.
      schedule: "0 0 * * * *"
      # Whose calendar a "day" is. THE correctness question in this feature, and
      # V27's header argues it in full: this platform's creators are in UTC+4, so
      # a UTC day would report every pledge taken between midnight and four in
      # the morning -- the tail of the evening, where the traffic is -- against
      # the previous day, and the dashboard would disagree with the creator's own
      # calendar with nothing on screen explaining why. `projects` carries no
      # zone of its own (V6), so a per-campaign answer would be a column nobody
      # sets. The writer and the reader both take it from here, and every row
      # records the zone it was bucketed under.
      zone: ${ANALYTICS_ROLLUP_ZONE:Asia/Baku}
      # How far back every pass recomputes, which is the answer to late-arriving
      # data. A pledge is attributed when `pledge.confirmed` is delivered, and
      # the relay retries with a backoff, so an attribution can land after its
      # own day has closed. Three days is four orders of magnitude beyond that
      # backoff's ten-minute ceiling, and it is what bounds the pass -- an
      # unbounded "recompute everything" would grow with the platform and
      # eventually overlap its own next tick. Later than this, a day stops moving
      # until somebody re-runs the range on purpose.
      re-rollup-window: PT72H
      # How old the newest rollup row may be before a pass says so at WARN. A
      # rollup that silently stops is worse than no rollup: the dashboard keeps
      # rendering and the numbers stay plausible. Six hours is comfortably more
      # than an hourly schedule plus the scheduler's backoff, and comfortably
      # less than a working day.
      stale-after: PT6H

  staff:
    # The first administrator, by verified address, comma separated. #295 moved
    # staff identity from this list to `staff_role_grants` (V48); what is left
    # here is the bootstrap, because granting a role needs ADMINISTER_STAFF and
    # a freshly migrated database has nobody who holds it.
    #
    # It reads MODERATOR_EMAILS, the variable the old list used, so no
    # deployment loses its staff on this release. Empty means nobody, and that
    # is deliberate: a deployment that forgets this has a console nobody can
    # open, which is a visible problem with a one-variable fix, where the
    # opposite mistake has no symptom until somebody uses it.
    #
    # Once real roles are granted, empty this. An administrator who exists only
    # in an environment variable is one nobody can withdraw through the console,
    # and /admin/staff says so.
    bootstrap-emails: ${MODERATOR_EMAILS:}

  payout:
    # IDN-EXT-01 (#41): `payout-destination-reminders`. Daily; a creator whose payout waits for their
    # VÖEN and business card is reminded on the days that are whole weeks after the hold ended.
    destination-reminder-schedule: "0 0 9 * * *"

  project:
    collaborators:
      # Seven days. An invitation nobody has accepted in a week is a typo or
      # somebody who has left; a link that works forever is edit access to an
      # unlaunched campaign sitting in an old mailbox.
      invitation-ttl: P7D
      # There is no mail transport yet (#86). On in local only -- an invitation
      # link in a log is edit access for anyone who can read logs, and that set
      # is always larger than it looks.
      log-invitation-links: false

    reminders:
      # POST /v1/projects/{id}/remind takes an arbitrary email address from a
      # caller with no credentials and promises to send mail to it. Unbounded,
      # that is an open relay with our domain on the envelope, so it is limited
      # exactly as registration is and for the same reason.
      #
      # Per source address, which bounds a script filling a campaign's list.
      signups-per-client: 20
      # And per email address, counted separately: the limit above does not
      # constrain somebody with many sources at all, and the harm being bounded
      # here is different -- subscribing one person's address to every campaign
      # on the platform is mail-bombing them.
      signups-per-address: 5
      window: PT15M
      # §8.4: reminder-sender, every minute. The event published when a campaign
      # goes live is what makes a launch feel instant; this is what makes it
      # correct -- a launch performed by the future campaign-launcher job, or one
      # whose after-commit callback was lost to a crash, is found here instead.
      send-schedule: "0 * * * * *"
      # A bound on one pass, not a target. A campaign with fifty thousand
      # followers must not be one transaction; the sweep returns a minute later.
      send-batch-size: 200
      # There is no mail transport yet (#86), so without this a developer cannot
      # exercise the unsubscribe path at all. On in local only.
      log-unsubscribe-links: false

    launches:
      # §8.4: scheduled-launch, every minute. This is the gap between the moment a
      # creator told their followers the campaign opens and the moment it actually
      # opens, so it is the second schedule in this file that should not be relaxed
      # to save a query.
      schedule: "0 * * * * *"
      # A bound on one pass rather than a target. Launch times cluster on the hour
      # and at the start of a month; the pass takes the oldest and comes back a
      # minute later for the rest.
      batch-size: 100

    finalisation:
      # §8.4: campaign-finalizer, every minute. This is the interval between a
      # campaign's countdown reaching zero and the campaign actually closing, so
      # it is the one schedule in this file that should not be relaxed to save a
      # query: for that whole interval the page says "0 minutes left" and the
      # campaign is still taking pledges.
      schedule: "0 * * * * *"
      # A bound on one pass, not a target. Deadlines cluster at midnight and at
      # the ends of months; the pass takes the oldest and returns a minute later
      # rather than becoming a run that overlaps its own next tick.
      batch-size: 200
      # §5.1, IDN-EXT-01 (#31): a campaign succeeds at this share of its goal. A share
      # in (0, 1], not a percentage — `80` is refused at start-up rather than failing
      # every campaign on the platform.
      success-threshold: 0.80
      # §5.1, IDN-EXT-01 (#33): how long after the first deadline a campaign is decided.
      # During it the campaign is CLOSING_WINDOW and the creator may extend or withdraw.
      closing-window: 7d

    extension:
      # §5.1, IDN-EXT-01 (#34). The Extend control opens this long before the first
      # deadline and stays open until the closing window ends; a campaign needs this
      # share of its goal; and the extension may reach this far past the FIRST deadline.
      opens-before: 7d
      threshold: 0.50
      limit: 60d

    withdrawal:
      # §5.1, IDN-EXT-01 (#41). A successful campaign whose creator has not withdrawn is withdrawn
      # for them this long after funding ended -- the first deadline, or the extension's end --
      # and the payout's fourteen-day hold then makes it day 44.
      automatic-after: 30d
      # Hourly: the day a campaign becomes due is what matters, not the minute.
      automatic-schedule: "0 15 * * * *"

    submission:
      # The three bounds §5.3 states as somebody else's decision rather than as a
      # number. Everything else in §5.3 is a literal and lives in
      # SubmissionChecklist; these do not, because they are not ours to fix.
      #
      # The goal bounds are a commercial position: below the minimum the platform
      # spends more moderating a campaign than the campaign is trying to raise,
      # and a goal of a few manats is almost always a test project somebody
      # forgot about. The maximum is not technical -- numeric(14,2) holds far
      # more -- but the point above which the platform is underwriting a
      # collection it has no basis to expect. Both move without a deployment,
      # which is the whole reason they are here.
      goal-minimum: ${GOAL_MINIMUM:100.00}
      goal-maximum: ${GOAL_MAXIMUM:1000000.00}
      # The smallest amount that can be charged at all. It belongs to the payment
      # provider (§9.3) and to the currency, and a reward priced below it is a
      # reward no backer can ever pay for. One AZN is the usual order of
      # magnitude for a card network's minimum; the real number arrives with the
      # provider.
      reward-price-minimum: ${REWARD_PRICE_MINIMUM:1.00}

    story:
      # How long after the newest story version another one may be written.
      #
      # The editor autosaves a few hundred milliseconds after a creator stops
      # typing, so a version per save would be one row per sentence -- thousands
      # of jsonb documents for an afternoon's work, and a history whose entries
      # differ by one word each. Five minutes turns continuous typing into a list
      # a person can actually read, at a cost of at most five minutes of writing
      # if something goes wrong.
      #
      # Configuration rather than a constant because it is a judgement about how
      # much work a creator may lose, and the answer for a test suite exercising
      # the rule is not the answer for production.
      version-interval: ${STORY_VERSION_INTERVAL:5m}
      # How many versions survive per project, oldest pruned first. Fifty at the
      # interval above is a working day and a half of recoverable history, which
      # is longer than anybody remembers what they changed. Unlike
      # project_state_transitions this is a convenience rather than an audit
      # trail, so it is pruned; see V8.
      versions-kept: ${STORY_VERSIONS_KEPT:50}

  # §4.8's pledge manager (#73, #74, #75). Only what an operator has to see is
  # here; the bounds on a survey are defaulted in PledgeManagerProperties and
  # argued there, for the reason AnalyticsProperties gives about a deployment that
  # configures none of it still having to start.
  pledge-manager:
    surveys:
      # §8.4's `survey-nudge`, daily. Daily rather than hourly because nothing about
      # a reminder is judged on promptness -- the difference between chasing
      # somebody at nine and at ten is not a difference anybody can perceive -- and
      # because each pass is a read over every open survey's backer list.
      nudge-schedule: ${SURVEY_NUDGE_SCHEDULE:0 0 9 * * *}
    addresses:
      # §17.2: postal addresses are encrypted at rest with application-managed keys.
      #
      # **There is no default, deliberately.** A generated key would change on the
      # next deploy and make every stored address unreadable, discovered by a creator
      # trying to ship; a key committed here would be a published key, which is not
      # encryption. So an unconfigured deployment starts, serves everything else, and
      # refuses the first address with a 503 naming this property --
      # PledgeManagerProperties.Addresses argues why that is better than failing to
      # start.
      #
      # Rotation is two deploys: add the new key to `keys`, deploy so every instance
      # can read it, then move `primary-key-id`. Old keys stay listed, and rows
      # migrate to the new one as they are rewritten.
      #
      # Nothing is bound here, and that is not an omission. Both the label and the
      # material are per environment, and a placeholder with an empty default would
      # bind an empty key under an empty label -- which is a deployment that looks
      # configured and refuses every write. A deployment sets, in its own
      # environment:
      #
      #   IDEANEST_PLEDGEMANAGER_ADDRESSES_PRIMARYKEYID=2026-08
      #   IDEANEST_PLEDGEMANAGER_ADDRESSES_KEYS_2026-08=<32 bytes, base64>
      primary-key-id: ~

  fx:
    # §21.2's display currency: central bank rates, cached hourly -- issue #327.
    #
    # OFF BY DEFAULT, AND THAT IS THE ONE DEFAULT HERE THAT IS NOT MERELY
    # CONSERVATIVE. Turning it on means this service makes an outbound HTTP call
    # to a third party on a timer, and a deployment that has not decided to do
    # that must not start doing it because it upgraded. Set IDEANEST_FX_ENABLED
    # to true, deliberately.
    #
    # Everything degrades to absence and never to a guess. A source that cannot
    # be reached, a currency with no published rate, and a rate older than
    # `max-age` all produce the same answer: no approximation on the screen. A
    # figure computed from a stale rate is worse than no figure, because a backer
    # acts on it.
    #
    # NOTHING HERE DECIDES WHAT ANYBODY IS CHARGED. §21.2: the display currency
    # is an approximation and collection happens in the project's currency. The
    # rate a backer was shown is stamped on their pledge at confirmation (V60),
    # which is the audit §21.2 asks for and is never an amount.
    enabled: ${IDEANEST_FX_ENABLED:false}
    # The Central Bank of Azerbaijan's daily publication. §21.2 says "central
    # bank rates" and §22.1 names this institution as the regulator, so it is the
    # source the specification means rather than a convenient one: public, no
    # key, one document per working day at a path carrying the date.
    #
    # Configurable so that an environment which must not reach the internet can
    # be pointed at a mirror or a fixture. `{date}` is required and start-up
    # fails without it -- a URL with no date in it would fetch the same document
    # every hour for ever and nobody would notice the rates had stopped moving.
    source-url: ${IDEANEST_FX_SOURCE_URL:https://www.cbar.az/currencies/{date}.xml}
    # What the source prices everything in, and what a display currency
    # approximates FROM. Manat, because §21.2 phase 1 collects in manat.
    base-currency: ${IDEANEST_FX_BASE_CURRENCY:AZN}
    # A closed set, and not "whatever the source published". The document lists
    # about forty currencies including gold and platinum, and a settings screen
    # offering to price a campaign in troy ounces is a screen nobody designed.
    #
    # The same four §21.2's phase 2 names, minus the manat: a reader who can be
    # shown a campaign in dollars today is the reader who will be able to back
    # one in dollars when phase 2 lands, and two lists that drifted apart would
    # mean a display currency nobody can ever pledge in.
    display-currencies: ${IDEANEST_FX_DISPLAY_CURRENCIES:USD,EUR,TRY,RUB}
    # §21.2's hourly cache over a source that publishes daily. Those are not in
    # conflict: the hour is how quickly the platform notices a new publication.
    # Five past rather than on the hour, like every other schedule in §8.4 -- a
    # fleet whose jobs all fire at :00 is a fleet whose database sees one spike.
    refresh-schedule: ${IDEANEST_FX_REFRESH_SCHEDULE:0 5 * * * *}
    # How old a published rate may be and still be shown. Four days: long enough
    # to survive a long weekend, since the source publishes on working days and a
    # Friday rate is the newest until Monday; short enough that a source which has
    # genuinely stopped answering takes the approximation off the screen within
    # the week rather than leaving whatever the platform last saw on it.
    #
    # Measured on the publication date and not on the fetch. A source answering
    # every hour with last Tuesday's rates has a fresh fetch and a stale rate,
    # and it is the rate a reader is shown.
    max-age: ${IDEANEST_FX_MAX_AGE:P4D}
    # Nothing waits on this: the job runs on a timer and a missed pass costs an
    # hour of freshness.
    request-timeout: ${IDEANEST_FX_REQUEST_TIMEOUT:PT10S}

  payment:
    # §8.4's `ledger-reconciliation` -- issue #70. A daily pass that asks whether the
    # platform's money adds up: the books balance, no account holds a sign it cannot,
    # and the ledger agrees with the record of what actually moved.
    #
    # IT REPORTS AND NEVER REPAIRS. A correcting entry depends on which of a dozen
    # things went wrong, and a job that guessed would turn a detectable problem into
    # an undetectable one. What it produces is a log line at ERROR -- one of §8.4's
    # three alerting conditions -- and the last report, which the health screen reads
    # so that a reconciliation which has silently stopped running is visible too.
    reconciliation:
      # Half past two, and deliberately not midnight: midnight is when every other
      # daily job on every other system runs, and a reconciliation competing with a
      # backup for the same connections is slow for a reason nobody will find.
      schedule: ${LEDGER_RECONCILIATION_SCHEDULE:0 30 2 * * *}
    provider:
      # Which adapter the platform charges through, and it is deliberately empty.
      #
      # #60 -- choose the payment provider and confirm §9.3's fourteen capabilities
      # in writing -- has not been answered, so no adapter exists. §9.2 says why no
      # stub ships in the meantime: one that returned an approval "would be worse
      # than nothing", because it would make the collection path look finished.
      #
      # Empty is what makes `CollectionRun` refuse to collect at all rather than
      # fail once per pledge, and a value naming a provider with no adapter on the
      # classpath is a start-up failure rather than a warning -- a deployment that
      # thinks it can collect and cannot is discovered on the one day it must not
      # be.
      primary: ${PAYMENT_PROVIDER:}
    # IDN-EXT-01 (#38): the Epoint.az adapter, API v1.0.3, used when `provider.primary` is
    # EPOINT -- spelled so. The owner chose Epoint; it stays unset by default because the
    # keys are per merchant, and naming EPOINT without the base URL and both keys is a
    # start-up failure rather than a first payment that cannot be signed. Epoint cannot
    # collect stored cards, so the retired collection jobs stay inert behind it (#39).
    epoint:
      base-url: ${EPOINT_BASE_URL:https://epoint.az/api/1}
      public-key: ${EPOINT_PUBLIC_KEY:}
      private-key: ${EPOINT_PRIVATE_KEY:}
      # The payment page's language when a request names none: az, en or ru.
      language: ${EPOINT_LANGUAGE:az}
    # IDN-EXT-01 (#40): `campaign-refunds`. Every backer of a campaign that ends below its
    # threshold, or is suspended or cancelled, is refunded in full, a batch at a time.
    refunds:
      # Every ten minutes: refunds are owed promptly, and a pass is bounded, so a campaign of
      # four thousand backers clears in a few hours without one pass holding the provider.
      schedule: "0 */10 * * * *"
      per-pass: 100
      # A refused refund is sent again after this, not on the next pass.
      retry-after: PT6H
      # A refund with no recorded outcome this old is settled from the provider's status.
      unresolved-after: PT1H
    collection:
      # §8.4: charge-processor, every minute. The pass that opens the collection of
      # campaigns that closed above goal and makes §9.6's first attempt against
      # their pledges -- so a creator watching their campaign close sees the money
      # start moving within a minute of the finaliser.
      schedule: "0 * * * * *"
      # §8.4: charge-retry, every six hours. §9.6's slots are at +24h, +72h and
      # +5 days, so nobody can tell an attempt made at 24:00 from one made at
      # 27:00, and a sweep every minute would be fifteen hundred passes a day
      # finding nothing.
      retry-schedule: "0 0 0/6 * * *"
      # How many campaigns one pass may open. Bounded because campaigns cluster at
      # midnight and at the ends of months.
      campaigns-per-pass: 20
      # §9.3's R-09, expressed as a rate. This IS the rate limit: a hundred charges
      # a minute is roughly 1.7 requests a second, which is a figure that can be
      # agreed with a provider in advance rather than discovered by being throttled
      # during a campaign's close. A campaign with four thousand backers therefore
      # takes about forty minutes, which is well inside §9.6's first day.
      charges-per-pass: 100
      drops-per-pass: 200
      # §9.6's last row: seven days after the close, a pledge that could not be
      # charged is dropped. Frozen onto each pledge when it is queued, so changing
      # this does not move a window already promised -- see V42.
      retry-window: P7D
      # §9.6's four attempts, as delays from the campaign's close. Measured from the
      # close and not from the previous attempt: the table says "+24 hours",
      # "+72 hours", "+5 days", which are positions rather than intervals.
      #
      # The length of this list is the whole of "how many attempts does a backer
      # get", so a fifth attempt is an entry here rather than a code change.
      attempt-delays:
        - PT0S
        - PT24H
        - PT72H
        - P5D
      # How long to wait before asking the provider again about a charge it
      # accepted and has not decided. Not one of §9.6's attempts -- the platform is
      # waiting on an answer rather than on a backer to change their card -- and the
      # same attempt number, and therefore the same idempotency key, is used.
      unresolved-recheck: PT1H
      # What a backer sees on their statement. A charge thirty to sixty days after
      # a pledge is exactly the charge somebody disputes because they did not
      # recognise it.
      statement-descriptor: ${STATEMENT_DESCRIPTOR:IdeaNest}
    circuit-breaker:
      # §9.3: "if the primary is unavailable on the day a large campaign closes, the
      # entire business stops." The breaker is not the answer to that -- only a
      # second provider is -- but it stops the platform rediscovering one outage
      # four thousand times in a single pass.
      #
      # Declines never count towards it. §9.6 puts them at 5-15% of a campaign, so a
      # breaker that counted them would open on a perfectly healthy Tuesday.
      failure-threshold: 5
      # One pass of charge-processor, so the next tick tries again: long enough that
      # the pass which found the outage stops, short enough that recovery needs
      # nobody.
      cooldown: PT1M
    webhooks:
      # §17.2's replay window. A signature does not expire, so this is the only
      # thing that does: long enough to absorb clock skew and a provider's own
      # queueing, short enough that a captured request is not a usable instruction
      # an hour later.
      tolerance: PT5M

  # SIMA Imza, and the two things that keep it switched off -- issue #428.
  #
  # A tick box is an acceptance; a SIMA Imza signature is a signature with the legal
  # force of a handwritten one, made by a citizen whose identity the state has already
  # verified. #429 is what spends that difference on the creator agreement. This block
  # is the mechanism, and it is inert by default in two independent ways.
  signature:
    provider:
      # Which adapter the platform signs through, and it is deliberately empty.
      #
      # Unlike `payment.provider`, an adapter DOES exist -- SimaImzaSignatureProvider,
      # against SIMA's sandbox. It is switched off by configuration rather than by
      # absence, because it is not a stub: it speaks to a real service that issues real
      # signatures against test certificates, so §9.2's argument against a fake does not
      # apply to it. What applies instead is that nothing calls it yet (#429 is the
      # caller) and that the environment below is gated.
      #
      # A value naming a provider with no adapter on the classpath is a start-up failure
      # rather than a warning, for `payment.provider.primary`'s reason.
      primary: ${SIGNATURE_PROVIDER:}
    sima:
      # SANDBOX or PRODUCTION, and PRODUCTION IS REFUSED AT START-UP.
      #
      # #423 -- obtain the legal opinion the three-party structure rests on -- has not
      # answered which personal data from a SIMA certificate may be kept and for how
      # long, and a certificate carries a citizen's name and FIN. #428's definition of
      # done asks for "no production credentials, and an explicit note that #423 gates
      # that"; a note is not a control, so `SignatureProviders` refuses to start on this
      # value instead. Lifting it is a one-line change made by whoever closes #423,
      # having read the personal-data row they obtained.
      environment: ${SIMA_ENVIRONMENT:SANDBOX}
      # Where the sandbox lives. Empty by default: there is no sensible default for
      # somebody else's service, and a guessed one is a deployment that appears
      # configured. Naming a provider above without completing these three is a
      # start-up failure.
      base-url: ${SIMA_BASE_URL:}
      client-id: ${SIMA_CLIENT_ID:}
      client-secret: ${SIMA_CLIENT_SECRET:}
      # How long a citizen has to answer the prompt on their phone. Long enough to find
      # the phone, short enough that a prompt somebody forgot about is not still
      # signable an hour later.
      session-life: PT5M
      # How long the platform waits on one call before treating SIMA as unreachable.
      # Deliberately short: a request thread blocked on a third party is the failure
      # mode that takes the whole service down with it.
      request-timeout: PT10S

  # Identity verification, and what it gates -- issues #105 and #431.
  #
  # V58 built the whole mechanism and gated nothing, on purpose: "what nobody may
  # decide here is who has to". #431 is the wiring change -- a payout will not leave
  # §6.3's hold unless the creator's verification is APPROVED -- and this flag is the
  # switch #424's answer flips.
  verification:
    # OFF. §22.1's anti-money-laundering row is a question, not an answer, and a
    # threshold invented here would be the compliance position this repository made
    # up. With this false every creator reads as NOT_REQUIRED, every payout releases,
    # and the gate is exercised by its tests rather than by production.
    #
    # Turning it on is this line. Nothing else changes: no migration, no release.
    required: ${VERIFICATION_REQUIRED:false}
    # How long an approval counts for. Two years, and expiry is not failure -- an
    # approval that has aged out holds the payout and asks the creator to re-verify
    # rather than failing it, because stranding money over a document that was fine
    # last year is the worse error.
    approval-life: P730D

  # When a creator agreement must be SIGNED rather than ticked -- issue #429.
  #
  # #424 decides the threshold and #424 waits on #423's anti-money-laundering row.
  # §22.1 says what happens if this repository decides instead: a threshold invented
  # here "would be the position a regulator reads back to us". So the shape of the
  # rule is in code and the number is here, and the day the answer arrives is a
  # configuration change.
  legal:
    signature:
      # OFF, and the default is load-bearing rather than lazy. #429:
      #
      #   Do NOT hardcode "everybody signs" as a placeholder -- an individual raising
      #   500 AZN sent to a state e-signature app is friction that will be blamed on
      #   the wrong thing.
      #
      # With this off, an acceptance is an acceptance and #426's gate is exactly what
      # it was. The signing flow still works for anybody who chooses to use it; what
      # is off is the demand.
      enabled: ${LEGAL_SIGNATURE_REQUIRED:false}
      # The funding goal above which a signature is required.
      #
      # ABSENT, not zero and not a guess. It is #424's number and nobody here may
      # choose it; a key with a value would be this repository having chosen one. Set
      # `ideanest.legal.signature.goal-ceiling` when #424 answers.
      #
      # The goal and not the amount collected -- #424's first point, on §9.6's
      # reasoning: a requirement that could fail a campaign after backers were told it
      # succeeded would be worse than no requirement at all.
      # Whether a registered entity signs regardless of amount. #424's fifth question,
      # and the answer here is the one that costs least if it is wrong: a company is
      # the case where the signature carries the most and the friction lands on
      # somebody who already has a stamp and a registration number. Inert while
      # `enabled` is false.
      required-for-legal-entity: true

  # §5.5's post-campaign obligations, as a clock -- issue #437.
  #
  # The platform enforced none of §5.5's four obligations, and an obligation that is
  # stated and never checked is a clause rather than a control. This is the first of
  # them -- "publish an update at least monthly after a successful campaign" -- and it
  # produces a visible state and an escalation to a moderator, and nothing else. No
  # automatic refund and no automatic suspension: §9.7 says the platform mediates.
  obligation:
    # §5.5 says "at least monthly". Thirty days rather than a calendar month, because a
    # calendar month makes the obligation shorter in February for no reason anybody
    # could defend to a creator.
    interval: P30D
    # How long before the due date the creator is warned, and the same value the page
    # uses to say "due soon". Two numbers that must agree are one number. A lead at
    # least as long as the interval is a start-up failure: it would make every campaign
    # overdue-looking from the moment it closed.
    reminder-lead: P7D
    # §8.4: update-obligation-sweep, daily. A sweep every minute would be fourteen
    # hundred passes a day finding the same nothing, and the state a campaign page reads
    # is a comparison rather than a column -- so a late pass still shows the right thing
    # and only sends the reminder a few hours later.
    #
    # Quarter past three, and deliberately not midnight, for the reconciliation's
    # reason.
    schedule: ${UPDATE_OBLIGATION_SCHEDULE:0 15 3 * * *}
    # How many obligations one pass may act on. Bounded because campaigns cluster at the
    # ends of months, so their obligations do too.
    per-pass: 200

  pledge:
    reservation:
      # §4.5's sequence diagram: "Reserve stock (5 min TTL)". A DRAFT pledge holds
      # a limited reward's place for this long and no longer.
      #
      # Here rather than in the code because it is a judgement with a cost on both
      # sides. Too short and a backer who goes to find their card comes back to a
      # tier they had already chosen being sold out; too long and one abandoned
      # checkout keeps a place off the market for the whole window, which on a
      # limited early-bird tier is the difference between a campaign's best hour
      # and its worst. The right number comes from watching real checkouts, and it
      # should not need a deployment.
      ttl: ${RESERVATION_TTL:5m}
      # IDN-EXT-01 (#39): once the backer opens the provider's payment page, the draft is held
      # this long instead, so a place is not given back while somebody is typing a card
      # number. Long enough for 3-D Secure and a bank app; a payment that arrives after it is
      # a paid pledge with no place, which is logged for a refund (#40).
      payment-window: ${PAYMENT_WINDOW:15m}
      # §8.4: reservation-cleaner, every minute. PostgreSQL has no TTL, so a
      # reservation lapses because this notices that it has -- see V17 for why the
      # reservation is in the database and not in Redis. A minute late is a minute
      # in which a tier looks sold out while a place is free, which is a lost sale
      # rather than a wrong one.
      cleanup-schedule: "0 * * * * *"
      # A bound on one pass, not a target. A campaign that closed with thousands of
      # checkouts in flight must not be one transaction; the rest are found a
      # minute later, oldest reservation first.
      cleanup-batch-size: 200
    rate-limit:
      # §17.3: "pledge 10/min per user". Per account rather than per address,
      # like every limit on a request that carries a token: one stolen token
      # should be worth one checkout at a time, and an attacker with a token can
      # come from anywhere.
      #
      # What it bounds is the work one caller can demand rather than fraud -- no
      # card is touched at a draft. Every one of them settles a stale pledge,
      # reads a campaign, resolves tiers and rates, and takes a row lock on a
      # reward tier, which on a popular campaign is the row every other backer
      # needs.
      pledges-per-user: 10
      window: PT1M

  idempotency:
    # §17.2: "keys retained 24 hours". After this a retried payment mutation is
    # executed again rather than replayed, so the number is the outer bound on
    # how long a client may take to retry -- long enough to cover an outage,
    # short enough that a table of what everybody bought yesterday does not keep
    # growing for a guarantee nobody is still relying on.
    retention: PT24H
    # Hourly, on the hour, like the anonymiser. The retention is a day, so the
    # minute this runs at cannot matter; what matters is that a missed hour costs
    # an hour of rows. On the durable scheduler since #134, and it was already
    # safe on more than one replica for a simpler reason than the reservation
    # sweep: the only effect is a delete, so a second replica finds nothing to
    # remove. The lease means only one of them looks.
    sweep-schedule: "0 0 * * * *"
    # A bound on one pass, not a target. A day of traffic must not be one
    # transaction; the sweep returns an hour later for the rest.
    sweep-batch-size: 500

  jobs:
    # §8.4's durable scheduler (#134). Every replica keeps its own timer -- a
    # scheduler on one elected replica is a single point of failure with an
    # election to get wrong -- and every trigger claims a lease before it does
    # anything, so the number of replicas stopped deciding how often the work
    # happens. The schedules themselves stay with the jobs, in the blocks above.
    #
    # What this process calls itself in a lease. A diagnostic and not an
    # authority: nothing is decided by comparing it to anything, so two replicas
    # sharing a name lose the ability to say which one is running a job and lose
    # nothing else. From the environment because a container knows its pod name
    # and the JVM does not; empty means the JVM's own pid@host, which is enough
    # to find the process in a log.
    holder: ${JOBS_HOLDER:}
    # How long the platform believes a holder that has stopped answering. The one
    # number here with a cost on both sides: too long and a replica killed
    # mid-run takes its job down with it for that long, too short and a run that
    # legitimately outlasts it is joined by a second replica part-way through. A
    # minute is comfortably longer than any pass §8.4 describes -- all of them
    # bounded batches -- and short enough that a crash costs a minute of one job.
    lock-lease: ${JOBS_LOCK_LEASE:PT1M}
    # Consecutive failures before the job stops being triggered at all, carrying
    # the last error for whoever has to look. The outbox's number for the outbox's
    # reason: a job that has failed the same way eight times is waiting for a
    # person and not for the network. Consecutive, so a job that fails once an
    # hour and succeeds the rest of the time never reaches it.
    max-attempts: 8
    # The delay after the first failure, doubled per consecutive failure. Not
    # zero: an immediate retry against a database that has just refused is the
    # same query arriving again before anything can have changed.
    retry-backoff: PT5S
    # The ceiling the doubling stops at. Without it the eighth delay would be
    # measured in hours, and the job would have stopped running in every practical
    # sense while still calling itself retryable.
    max-backoff: PT10M

  outbox:
    # Every second. §8.3's outbox is on the path of things a person is watching
    # happen -- §12.1's pledge counter, the notification behind a confirmation --
    # so latency here is user-visible in a way the hourly sweeps above are not.
    # On the durable scheduler since #134, and it was already safe on more than
    # one replica because the claim is FOR UPDATE SKIP LOCKED: two relays divide
    # the queue between them rather than meeting on a row. The lease means one of
    # them polls, rather than all of them opening a transaction a second to find
    # the queue already drained.
    poll-schedule: "* * * * * *"
    # A bound on one pass, not a target. A backlog built up while a transport was
    # down must not be one pass that overlaps its own next tick; the rest is a
    # second away.
    batch-size: 100
    # Deliveries, including the first. An event refused the same way eight times is
    # waiting for a person and not for the network, and retrying it for ever spends
    # a request per poll for ever while burying the one fact that matters -- that
    # it was never delivered -- in a log line repeated a million times. After this
    # it is a dead letter carrying the last error, which is a question for an
    # operator rather than a disappearance.
    retry-backoff: PT5S
    # The ceiling the doubling stops at. Without it the eighth delay would be
    # measured in hours, and the event would have stopped moving in every practical
    # sense while still calling itself retryable.
    max-backoff: PT10M
    max-attempts: 8

  notification:
    delivery:
      # Every second, like the relay above and for the relay's reason: this is the
      # second hop of the same path a person is watching. A pledge is confirmed, the
      # relay publishes the event, the fan-out writes the row, and this sends it --
      # all of which should finish before the backer has stopped looking at the page.
      # The two schedules being equal is what keeps the second hop from dominating
      # the first.
      send-schedule: "* * * * * *"
      # A bound on one pass, not a target. The outbox's argument exactly: a backlog
      # built up while a transport was down must not be one pass that overlaps its
      # own next tick.
      batch-size: 100
      # Deliberately the outbox's numbers. An operator reading a stuck notification
      # at three in the morning should be reading the vocabulary they already know
      # from outbox_events, not a second one that differs in the third decimal
      # place.
      retry-backoff: PT5S
      max-backoff: PT10M
      # Sends attempted before the notification is a dead letter, including the
      # first. A message refused the same way eight times is waiting for a person
      # and not for the network. Unlike a dead-lettered event this is something the
      # platform recorded as owed to somebody and will now never tell them, which is
      # why NotificationDispatch logs it at ERROR rather than WARN.
      max-attempts: 8
    # #86. The relay is spring.mail above; this is the envelope. Deliberately
    # not a reply-to: there is no inbox behind no-reply, and pointing a reply
    # button at an address nobody reads is worse than offering none.
    email:
      from: ${MAIL_FROM:no-reply@ideanest.az}
      from-name: ${MAIL_FROM_NAME:IdeaNest}
      # Every link in every template is built from this. A preview environment
      # that left it at the default would send its readers to production.
      base-url: ${WEB_BASE_URL:http://localhost:3000}

  audit:
    # Two bounds on attacker-controlled text, and they are here rather than in the
    # code because of what makes this table different: everything else in the
    # schema has something that prunes it, and audit_logs has a trigger that
    # refuses DELETE. What arrives stays until the month holding it is detached,
    # which is not something that happens yet (#134). So an unbounded User-Agent
    # is not a formatting problem -- it is unbounded growth in the one table that
    # cannot be tidied afterwards, bought for the price of one header.
    #
    # A thousand characters is several sentences: enough for "changed from these
    # capabilities to those", far short of somewhere to put a request body.
    # Applied after redaction, so a mask is never cut in half.
    detail-max-length: 1000
    # Real user agents run to a couple of hundred characters. This keeps every one
    # of them and cuts anything using the header as a channel.
    user-agent-max-length: 512

  user:
    # §17.4: thirty days between asking and anything being destroyed. Long
    # enough that a deletion made in anger can be undone the next morning, and
    # that an account closed by somebody who stole a session can be recovered.
    deletion-grace-period: P30D
    # A bound on one run, not a target. Without it a backlog built up during an
    # outage is attempted in one pass that overlaps its own next tick.
    anonymisation-batch-size: 100
    # Hourly, on the hour. The deadline is a date, so the minute it runs at does
    # not matter; what matters is that a missed hour costs an hour.
    anonymisation-schedule: "0 0 * * * *"
    rate-limit:
      # An export is a copy of everything we hold about a person. One stolen
      # access token should be worth one copy, not a tap.
      exports-per-account: 3
      # The deletion endpoint verifies a password, which makes it a password
      # oracle for whoever holds a token. Bounded like any other.
      deletion-attempts-per-account: 5
      window: PT1H

  auth:
    # Long enough to survive a mail queue and a night's sleep, short enough that
    # a forwarded message is not a standing key to the account.
    verification-token-ttl: PT24H

    # §4.1's A-06. One hour, and deliberately not the twenty-four above: that
    # link proves an address, this one replaces a credential.
    password-reset-token-ttl: PT1H

    # §4.1's A-12. Longer than a reset -- the person following it has to reach a
    # mailbox they may not have set up on the device in their hand -- and shorter
    # than a verification, because until it is spent the account is in two minds
    # about where it lives.
    email-change-token-ttl: PT6H

    # Length, and almost nothing else. Composition rules produce Password1! and
    # a note on a monitor; NIST dropped them for that reason.
    password-min-length: 12
    # Not a strength rule: Argon2 is deliberately expensive, so an unbounded
    # input is a way to spend our memory on demand.
    password-max-length: 256

    # A verification link in a log is an account takeover for anyone who can
    # read logs, and that set is always larger than it looks. On in local only.
    log-verification-links: false

    argon2:
      # OWASP's recommendation: 19 MiB, two iterations, one lane. Memory is the
      # parameter that makes a GPU no better at this than a CPU. Raising these
      # later rehashes on next sign-in rather than locking anyone out, because
      # Argon2's encoded output carries the parameters it was made with.
      memory-kib: 19456
      iterations: 2
      parallelism: 1
      salt-length: 16
      hash-length: 32

    rate-limit:
      registrations-per-address: 5
      # Counted separately from the address limit, so that an attacker with many
      # source addresses is still bounded when probing one account.
      registrations-per-email: 3
      # Not about guessing a 256-bit token. About not letting one client spend
      # the database on the attempt.
      verifications-per-address: 20
      # §4.1's A-06. Every accepted request sends mail from an unauthenticated
      # form, so what this bounds is our mail reputation rather than a guess.
      password-resets-per-address: 5
      # Counted separately, as registration is: an attacker with many source
      # addresses is otherwise unbounded against one mailbox, and a mailbox full
      # of reset links is a workable way to make somebody stop reading them.
      password-resets-per-email: 3
      # §4.1's A-12 and A-13, together. Each attempt costs an Argon2 verification
      # of the current password, so this bounds what a stolen access token can
      # spend as well as what it can guess.
      credential-changes-per-user: 10
      # §17.3: five sign-in attempts per address per fifteen minutes.
      sign-ins-per-address: 5
      sign-ins-per-email: 5
      # The control that makes a six-digit code safe. Three codes are valid at
      # any moment once a step of clock skew either side is allowed, so five
      # attempts is fifteen chances in a million per challenge -- and a new
      # challenge costs the password again.
      two-factor-codes-per-challenge: 5
      # Enabling, confirming, or disabling. Each costs an Argon2 verification,
      # so this bounds what a stolen access token can spend as well as guess.
      two-factor-changes-per-user: 10
      # Higher than password sign-in because a failure here is usually a stale
      # token rather than a guess, and a retry loop on a mobile client should not
      # lock the user out of a button they pressed once. An ID token cannot be
      # guessed; what this bounds is the verification work one caller can demand.
      social-sign-ins-per-address: 20
      window: PT15M

    token:
      issuer: ${TOKEN_ISSUER:https://api.ideanest.az}
      audience: ${TOKEN_AUDIENCE:ideanest}
      # Short, because an access token is stateless: revoking a session cannot
      # reach one already issued, so this value is exactly the window in which a
      # revoked session still works.
      access-token-ttl: PT15M
      # Absolute, and not extended by use. A session is thirty days and then the
      # user signs in again.
      refresh-token-ttl: P30D
      # RS256. From the secret store, never from this file. Absent outside local
      # and test, the service refuses to start rather than inventing a key that
      # would differ per replica and change on every restart.
      private-key-pem: ${TOKEN_PRIVATE_KEY_PEM:}
      public-key-pem: ${TOKEN_PUBLIC_KEY_PEM:}

    two-factor:
      # What the authenticator app shows above the six digits.
      issuer: IdeaNest
      # The proof of a correct password, waiting for a code. Long enough to find
      # the phone, short enough that one captured from a log is dead by the time
      # anybody reads it.
      challenge-ttl: PT5M
    oauth:
      # Tolerance for the provider's clock, and nothing more. Every second here
      # is a second an expired token still works.
      clock-skew: PT60S
      # Ours, not the provider's. Google's ID tokens live for an hour; a token
      # that is genuinely the result of the sign-in happening now is seconds old,
      # and anything older has been sitting somewhere it could be read.
      max-token-age: PT5M
      providers:
        google:
          issuer: https://accounts.google.com
          jwks-uri: https://www.googleapis.com/oauth2/v3/certs
          # One client identifier per platform, comma separated. Not a secret —
          # a client id is public by design — but environment-specific, so it
          # comes from the environment. Absent means Google sign-in is not
          # enabled here, and the endpoint answers 501 rather than the service
          # refusing to start over a feature nobody has called.
          audiences: ${GOOGLE_CLIENT_IDS:}
          # Every client we ship sends one. A flow that cannot is not one we
          # accept: without it a token is not bound to the request that asked
          # for it.
          require-nonce: true
        apple:
          issuer: https://appleid.apple.com
          jwks-uri: https://appleid.apple.com/auth/keys
          # The bundle identifier on iOS, the Services ID on the web.
          audiences: ${APPLE_CLIENT_IDS:}
          require-nonce: true

    refresh-cookie:
      name: ideanest_refresh
      secure: true
      # Not sent with every API call — only to the endpoints that spend it.
      path: /v1/auth
      # The browser does not attach it to any cross-site request, which is what
      # stops another origin from making it spend the token.
      same-site: Strict

logging:
  # Levels only. The format, the correlation identifiers, and the redaction that
  # §17.4 requires are in logback-spring.xml, because none of them is expressible
  # here: `logging.pattern.*` cannot wrap an encoder, and a masking rule that is
  # not in the pipeline is a masking rule every call site has to remember.
  level:
    root: INFO
    az.ideanest: INFO
