# §21.1's Turkish, phase 3. The same keys as messages.properties, in the same order.
#
# The arguments are the English file's and they are positional -- {0} the
# recipient's name, {1} the campaign's title, {2} the amount already formatted,
# {3} the type's one further fact. A translation may reorder them and may leave
# one out; it may not refer to a slot its type does not fill, which is what
# EmailCopyTests renders every key of every language to catch.
#
# ---------------------------------------------------------------------------
# APOSTROPHES, AND WHY THERE ARE NONE
# ---------------------------------------------------------------------------
#
# Turkish attaches a case suffix to a proper noun with an apostrophe, and every
# line here is a java.text.MessageFormat pattern -- where a single quote opens a
# literal section, so "IdeaNest'e {1} geldi" would print the placeholder rather
# than the campaign. Doubling it works and reads badly in a file a translator has
# to edit, so these lines are written to avoid the construction: "IdeaNest
# üzerinde" rather than "IdeaNest'te". EmailCopyTests asserts that no line carries
# a lone quote.
