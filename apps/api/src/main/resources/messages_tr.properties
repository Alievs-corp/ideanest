# ---------------------------------------------------------------------------
# Kimlik doğrulama iletileri -- #86'nın diğer yarısı, bildirim değil
# ---------------------------------------------------------------------------
#
# Hiçbiri bir NotificationType değil: `notifications` tablosuna satır yazılmaz ve
# hiçbir tercih bunları kapatamaz. Bu yüzden MimeTransactionalMailer bunları
# yukarıdaki tercih satırı olmadan gönderir.
#
# {0} yalnızca EMAIL_CHANGE_NOTICE içinde var ve hesabın taşındığı adrestir.
# O anahtarların metinlerinde kesme işareti kullanılmaz: MessageFormat kesme
# işaretini alıntı başlangıcı sayar ve cümlenin geri kalanını olduğu gibi basar.

