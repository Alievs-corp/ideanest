# Local development stack. `./gradlew bootRun` starts it and stops it again;
# `docker compose up -d` from this directory does the same by hand.
#
# Nothing here is a production topology. Credentials are fixed and weak on
# purpose, so that nobody is tempted to reuse a file that looks deployable.
#
# Every port is published on the loopback address only. Docker's default is
# every interface, which on a laptop is the café's network: a database whose
# password is the word `ideanest` and a mailbox holding every reset link the
# stack ever sent, reachable by anybody on the same Wi-Fi -- and Docker's
# published ports bypass the host firewall on Linux, so a firewall rule does
# not stop it either.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ideanest-postgres
    environment:
      POSTGRES_DB: ideanest
      POSTGRES_USER: ideanest
      POSTGRES_PASSWORD: ideanest
      # Deterministic collation. Sort order differing between a developer
      # machine and the server turns into pagination that skips rows.
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=en-US --encoding=UTF8'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ideanest -d ideanest']
      interval: 5s
      timeout: 3s
      retries: 20

  # #86's mailbox. Accepts everything, delivers nothing, and shows what it took
  # at http://localhost:8025 — which is the property that matters locally: a
  # developer running the campaign finaliser should be able to read the mail it
  # produced without any of it reaching a real address.
  #
  # No volume. A mailbox that survived a restart would accumulate the output of
  # every test run somebody ever did, and none of it is worth keeping.
  mailpit:
    image: axllent/mailpit:v1.28
    container_name: ideanest-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
